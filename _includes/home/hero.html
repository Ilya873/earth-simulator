{%- assign L = page.lang | default: site.lang | default: 'ru' -%}
{%- assign t = site.data.i18n -%}
<section class="hero" aria-labelledby="hero-title">
  <div class="hero__sheet" data-atlas
       data-lang="{{ L }}"
       data-str='{"n":"{{ t.hero_n[L] }}","s":"{{ t.hero_s[L] }}","e":"{{ t.hero_e[L] }}","w":"{{ t.hero_w[L] }}","m":"{{ t.hero_m[L] }}","elev":"{{ t.hero_elev[L] }}","depth":"{{ t.hero_depth[L] }}","eq":"{{ t.hero_equator[L] }}","cancer":"{{ t.hero_cancer[L] }}","capricorn":"{{ t.hero_capricorn[L] }}","arctic":"{{ t.hero_arctic[L] }}","antarctic":"{{ t.hero_antarctic[L] }}"}'>
    <canvas class="hero__map" aria-hidden="true"></canvas>
    <svg class="hero__north" viewBox="0 0 40 64" aria-hidden="true">
      <path d="M20 4 L29 40 L20 33 L11 40 Z" fill="currentColor"/>
      <path d="M20 4 L20 33 L11 40 Z" fill="#0A1320" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <text x="20" y="60" text-anchor="middle">{% if L == 'en' %}N{% else %}С{% endif %}</text>
    </svg>

    <div class="cartouche">
      <p class="cartouche__kicker">{{ t.hero_kicker[L] }}</p>
      <h1 class="cartouche__title" id="hero-title"><span>Earth</span> <span>Simulator</span></h1>
      <p class="cartouche__native">{{ t.hero_native[L] }}</p>
      <p class="cartouche__lead">{{ t.hero_lead[L] }}</p>
      <div class="cartouche__actions">
        <a class="btn btn--solid" href="{{ site.steam_url }}" rel="noopener" target="_blank">{{ t.cta_steam[L] }}<span class="ext" aria-hidden="true">↗</span></a>
        <a class="btn btn--ghost" href="{{ site.telegram_url }}" rel="noopener" target="_blank">{{ t.cta_telegram[L] }}<span class="ext" aria-hidden="true">↗</span></a>
      </div>
    </div>


    <div class="hero__tools">
      <p class="hero__readout mono" data-readout aria-hidden="true">&nbsp;</p>
      <p class="hero__hint">{{ t.hero_hint[L] }}</p>
      <button type="button" class="hero__new label" data-new-world>↻ {{ t.hero_new[L] }}</button>
    </div>
  </div>
</section>
