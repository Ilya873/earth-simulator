{%- assign L = page.lang | default: site.lang | default: 'ru' -%}
{%- assign t = site.data.i18n -%}
{%- assign rm = site.data.roadmap -%}
{%- assign phases = rm.phases -%}
{%- assign N = phases | size -%}
{%- assign RH = 58 -%}
{%- assign X0 = 16 -%}
{%- assign svgh = N | times: RH -%}
<figure class="tl-wrap">
  <figcaption class="tl-cap">
    <span class="label">{{ t.chart_title[L] }}</span>
    <span class="tl-cap__note">{{ t.chart_note[L] }}</span>
  </figcaption>
  <div class="tl" style="--n: {{ N }}; --rh: {{ RH }}px" data-tl>
    <div class="tl__h tl__h--eon label">{{ t.col_eon[L] }}</div>
    <div class="tl__h tl__h--sheet label">{{ t.col_sheet[L] }}</div>
    <div class="tl__h tl__h--upd label">{{ t.col_update[L] }}</div>
    <div class="tl__h tl__h--when label">{{ t.col_when[L] }}</div>
    <div class="tl__h tl__h--prog label">{{ t.col_progress[L] }}</div>
    <div class="tl__h tl__h--links label">{{ t.col_links[L] }}</div>

    {%- assign start = 2 -%}
    {%- for e in rm.eons %}
    {%- assign eph = phases | where: "eon", e.id -%}
    {%- assign cnt = eph | size -%}
    <div class="tl__eon" style="grid-row: {{ start }} / span {{ cnt }}; --ec: {{ e.color }}">
      <span><b>{{ e.roman }}</b><span class="tl__eon-n">{{ e.name[L] }}</span><em>{{ e.span[L] }}</em></span>
    </div>
    {%- assign start = start | plus: cnt -%}
    {%- endfor %}

    {%- for p in phases %}
    {%- assign r = forloop.index | plus: 1 -%}
    {%- assign total = p.items | size -%}
    {%- assign dn = p.items | where: "s", "done" | size -%}
    <div class="tl__row{% if p.now %} is-now{% endif %}" data-row="{{ p.id }}" data-deps="{{ p.deps | join: ' ' }}" style="--pc: {{ p.color }}; --r: {{ r }}">
      <div class="tl__c tl__sheet mono">{{ p.sheet }}</div>
      <div class="tl__c tl__upd">
        <a href="#sheet-{{ p.id }}"><span class="tl__ver mono">{{ p.ver }}</span> {{ p.name[L] }}</a>
        <span class="tl__when-m mono">{{ p.when[L] }}</span>
        {%- if p.now %}<span class="tl__here">{{ t.you_are_here[L] }}</span>{% endif %}
      </div>
      <div class="tl__c tl__when mono" data-precision="{{ p.precision }}">{{ p.when[L] }}</div>
      <div class="tl__c tl__prog" aria-label="{{ dn }} {{ t.items_done[L] }} {{ total }}">
        <span class="tl__syms">{% for it in p.items %}<i class="sym sym--{{ it.s }}"></i>{% endfor %}</span>
      </div>
    </div>
    {%- endfor %}

    <div class="tl__links" style="grid-row: 2 / span {{ N }}">
      <svg viewBox="0 0 150 {{ svgh }}" preserveAspectRatio="none" width="150" height="{{ svgh }}" aria-hidden="true">
        {%- for p in phases %}
        {%- assign i = forloop.index0 -%}
        {%- assign yi = i | times: RH | plus: 29 -%}
        {%- for d in p.deps %}
        {%- for q in phases %}{% if q.id == d %}{% assign j = forloop.index0 %}{% endif %}{% endfor -%}
        {%- assign yj = j | times: RH | plus: 29 -%}
        {%- assign dy = i | minus: j -%}
        {%- assign k = dy | times: 26 | plus: 10 -%}
        {%- if k > 168 %}{% assign k = 168 %}{% endif -%}
        {%- assign cx = X0 | plus: k -%}
        <path class="tl__arc" data-from="{{ d }}" data-to="{{ p.id }}" d="M{{ X0 }} {{ yj }} C{{ cx }} {{ yj }} {{ cx }} {{ yi }} {{ X0 }} {{ yi }}"/>
        {%- endfor %}
        {%- endfor %}
        {%- for p in phases %}
        {%- assign yi = forloop.index0 | times: RH | plus: 29 -%}
        <circle class="tl__node tl__node--{{ p.status }}" data-node="{{ p.id }}" cx="{{ X0 }}" cy="{{ yi }}" r="4.5" style="--pc: {{ p.color }}"/>
        {%- endfor %}
      </svg>
    </div>
  </div>
</figure>
