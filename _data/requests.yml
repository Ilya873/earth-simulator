# Просьбы игроков из обсуждений в Steam и комментариев на YouTube.
# phase — id листа из roadmap.yml, где просьба выполняется.
# Статус берётся из листа; чтобы переопределить для конкретной просьбы — добавьте s: done | wip | plan | idea

- phase: v22
  ru: "Показывать информацию о бедствии при наведении: силу урагана, осадки, площадь пожара"
  en: "Hover over disasters to see information: hurricane strength, rainfall, wildfire area"
- phase: v22
  ru: "Реальные шкалы: Саффир — Симпсон для ураганов, шкалы для вулканов и землетрясений"
  en: "Real-world scales: Saffir–Simpson for hurricanes, proper scales for volcanoes and earthquakes"
- phase: v22
  ru: "Показывать отклонение температуры от начала игры, а не среднюю температуру суши"
  en: "Show the temperature deviation from the start, not the average land temperature"
- phase: v22
  ru: "Корабли не должны плавать по замёрзшему океану; что будет, если важный пролив замёрзнет"
  en: "Boats shouldn’t cross frozen oceans; simulate what happens when a key strait freezes"
- phase: v22
  ru: "Кратеры после ядерных ракет и метеоритов, которые со временем затягиваются"
