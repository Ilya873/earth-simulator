# I. Мир сегодня
world_title: { ru: "Мир сегодня", en: "The world today" }
world_lead:
  ru: "Вы задаёте рельеф, ветра, течения и климат, а дальше мир живёт сам. Реки находят дорогу к морю, пустыни и леса занимают свои широты. Племена вырастают в державы: торгуют, воюют, меняют династии и тянутся к космосу. В любой момент можно спуститься на землю и пройтись по миру от первого лица."
  en: "You set the terrain, winds, currents and climate, and then the world lives on its own. Rivers find their way to the sea; deserts and forests settle into their latitudes. Tribes grow into states that trade, wage war, change dynasties and reach for space. At any moment you can step down to the ground and walk the world in first person."
world_col1_t: { ru: "Природа", en: "Nature" }
world_col1:
  ru: "Испарение и перенос влаги ветром, муссоны и дождевая тень, океанские течения, ледники и парниковый эффект. Девятнадцать биомов и тридцать пять видов животных, которые мигрируют, вымирают и попадают в стада."
  en: "Evaporation and wind-borne moisture, monsoons and rain shadows, ocean currents, ice sheets and the greenhouse effect. Nineteen biomes and thirty-five animal species that migrate, die out and end up in herds."
world_col2_t: { ru: "Общество", en: "Society" }
world_col2:
  ru: "Шесть эпох — от племён до космоса. Десять форм правления, династии с родословными, войны, флоты, колонии и ядерное оружие. Каждая держава ведёт свою летопись."
  en: "Six eras, from tribes to space. Ten forms of government, dynasties with family trees, wars, fleets, colonies and nuclear weapons. Every state keeps its own chronicle."
world_col3_t: { ru: "Прогулка", en: "On foot" }
world_col3:
  ru: "Любая клетка карты — место, куда можно спуститься. Города своей эпохи, жители со своими именами и семьями, погода, день и ночь, оружие и транспорт."
  en: "Any cell on the map is a place you can step into. Cities of their era, locals with names and families, weather, day and night, weapons and vehicles."
