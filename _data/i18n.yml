# II. Дорожная карта
roadmap_title: { ru: "Дорожная карта", en: "Roadmap" }
roadmap_lead:
  ru: "Карта составлена по исходному коду игры: что уже работает, на что опирается каждая следующая система и в каком порядке их выгоднее строить. Ближние листы сняты инструментально, их сроки точны до месяца. Дальние нанесены глазомерно и предположительно: очертания верны, а детали будут уточняться с каждым обновлением и вашими отзывами."
  en: "This map was drawn from the game’s source code: what already works, what each next system rests on, and in which order they are best built. The nearest sheets are surveyed, with dates accurate to the month. The farther ones are sketched or conjectural: the outlines are right, and the details will be refined with every update and your feedback."
chart_title: { ru: "Шкала времени проекта", en: "Project timescale" }
chart_note:
  ru: "Дуги справа — зависимости: лист опирается на тот, от которого к нему тянется дуга. Наведите на строку, чтобы увидеть связи."
  en: "The arcs on the right are dependencies: a sheet builds on the one its arc comes from. Hover a row to see its links."
