rules_title: { ru: "Как составлена карта", en: "How this map was drawn" }
rule1_t: { ru: "Сначала опоры", en: "Foundations first" }
rule1:
  ru: "Система строится раньше тех, что на неё опираются. Поэтому перестройка движка стоит до живых людей, экономики и мультиплеера, а не после."
  en: "A system is built before the systems that rest on it. That is why the engine rebuild comes before living people, the economy and multiplayer — not after."
rule2_t: { ru: "Каждое обновление играбельно", en: "Every update is playable" }
rule2:
  ru: "Даже техническое обновление приносит то, что видно в игре: глобус, большие карты и высокие скорости."
  en: "Even a technical update brings something you can see in the game: a globe, bigger maps, higher speeds."
rule3_t: { ru: "Одна правда о мире", en: "One truth about the world" }
rule3:
  ru: "Всё, что вы видите на прогулке, следует из состояния симуляции. Никаких лошадей до приручения и танков до пороха."
  en: "Everything you see on foot follows from the state of the simulation. No horses before taming, no tanks before gunpowder."
rule4_t: { ru: "Сначала глубина, потом блеск", en: "Depth first, then shine" }
rule4:
  ru: "Lowpoly остаётся и становится красивее с каждым обновлением. Реалистичная графика для мощных ПК придёт, когда игра станет глубокой."
  en: "Low-poly stays and gets more beautiful with every update. Realistic graphics for powerful PCs come once the game is deep."
rule5_t: { ru: "Порядок важнее дат", en: "Order over dates" }
rule5:
  ru: "Сроки — ориентир: что-то выйдет раньше, что-то позже. А идеи игроков вписаны прямо в карту — включите фильтр «Идеи игроков»."
  en: "Dates are a heading: some things arrive earlier, some later. Players’ ideas are built right into the map — turn on the “Players’ ideas” filter."

