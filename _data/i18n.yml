rules_title: { ru: "Пять правил этой карты", en: "Five rules of this map" }
rule1_t: { ru: "Сначала опоры", en: "Foundations first" }
rule1:
  ru: "Система строится раньше тех, что на неё опираются. Поэтому перестройка движка стоит до живых людей, экономики и мультиплеера, а не после."
  en: "A system is built before the systems that rest on it. That is why the engine rebuild comes before living people, the economy and multiplayer — not after."
rule2_t: { ru: "Каждый лист играбелен", en: "Every sheet is playable" }
rule2:
  ru: "Даже технический лист приносит то, что видно в игре: глобус, большие карты и высокие скорости."
  en: "Even a technical sheet brings something you can see in the game: a globe, bigger maps, higher speeds."
rule3_t: { ru: "Одна правда о мире", en: "One truth about the world" }
rule3:
  ru: "Всё, что вы видите на прогулке, следует из состояния симуляции. Никаких лошадей до приручения и танков до пороха."
  en: "Everything you see on foot follows from the state of the simulation. No horses before taming, no tanks before gunpowder."
rule4_t: { ru: "Сначала глубина, потом блеск", en: "Depth first, then shine" }
rule4:
  ru: "Lowpoly остаётся и становится красивее с каждым листом. Реалистичная графика для мощных ПК придёт, когда игра станет глубокой."
  en: "Low-poly stays and gets more beautiful with every sheet. Realistic graphics for powerful PCs come once the game is deep."
rule5_t: { ru: "Моды — полноправные граждане", en: "Mods are first-class citizens" }
rule5:
  ru: "Всё, что описано данными, открыто мододелам и Мастерской Steam."
  en: "Everything described as data is open to modders and the Steam Workshop."

