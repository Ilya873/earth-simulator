# II. Дорожная карта — звёздная карта
roadmap_title: { ru: "Дорожная карта", en: "Roadmap" }
roadmap_lead:
  ru: "Каждое обновление — звёздная система, каждая новая возможность — планета на её орбите. Светящиеся планеты уже в игре, бирюзовые — в работе. Наведите на систему, чтобы увидеть, на что она опирается, и нажмите, чтобы открыть подробности. Сроки примерные."
  en: "Every update is a star system, and every new feature is a planet on its orbit. Shining planets are already in the game, teal ones are in progress. Hover a system to see what it rests on, and click it to open the details. Dates are approximate."
