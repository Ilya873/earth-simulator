      - k: play
        s: plan
        ru: ["Правление как в стратегии", "Управляйте любой державой с карты: экономика, армия, дипломатия, наука."]
        en: ["Rule like a strategy game", "Run any state from the map: economy, army, diplomacy, science."]
      - k: sim
        s: plan
        req: true
        ru: ["Вера отвечает богу", "Часто бьёте молниями — рождается культ Громовержца; засухи, чудеса и кары создают пантеоны, пророков и ереси."]
        en: ["Faith answers the god", "Strike often with lightning and a Thunder God cult is born; droughts, miracles and wrath create pantheons, prophets and heresies."]
      - k: sim
