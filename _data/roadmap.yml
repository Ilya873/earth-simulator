# Дорожная карта Earth Simulator.
# Как обновлять:
#   * статус пункта:  s: done | wip | plan | idea
#       done — уже в игре, wip — в работе, plan — запланировано, idea — исследование/вижн
#   * статус листа (phase.status) — те же значения; лист с now: true получает метку «Вы здесь»
#   * пункт, о котором просили игроки, помечается req: true
#   * k — дорожка: sim, walk, play, eng, gfx, com (названия — в tracks ниже)
# Каждый пункт: ru: [заголовок, пояснение], en: [title, description]

precision:
  exact:
    ru: "Инструментальная съёмка"
    en: "Surveyed"
    note_ru: "сроки точны до месяца"
    note_en: "dates accurate to a month"
  approx:
    ru: "Глазомерная съёмка"
    en: "Sketched"
    note_ru: "сроки точны до квартала"
    note_en: "dates accurate to a quarter"
  conj:
    ru: "Предполагаемые очертания"
    en: "Conjectural"
    note_ru: "ориентир, будет уточняться"
    note_en: "a heading, will be refined"

status:
  done: { ru: "в игре", en: "in the game" }
  wip: { ru: "в работе", en: "in progress" }
  plan: { ru: "запланировано", en: "planned" }
  idea: { ru: "исследование", en: "research" }

tracks:
  sim: { ru: "Симуляция", en: "Simulation" }
  walk: { ru: "Прогулка", en: "Walk mode" }
  play: { ru: "Игрок", en: "Player" }
  eng: { ru: "Движок", en: "Engine" }
  gfx: { ru: "Графика", en: "Graphics" }
  com: { ru: "Сообщество", en: "Community" }

eons:
  - id: e1
    roman: "I"
    color: "#D19A4E"
    name: { ru: "Мир людей", en: "The Human World" }
    span: { ru: "2026 — 2028", en: "2026 — 2028" }
  - id: e2
    roman: "II"
    color: "#6E9C7C"
    name: { ru: "Мир живого", en: "The Living World" }
    span: { ru: "2028 — 2029", en: "2028 — 2029" }
  - id: e3
    roman: "III"
    color: "#6F7DAE"
    name: { ru: "Мир звёзд", en: "The World of Stars" }
    span: { ru: "2029 →", en: "2029 →" }

phases:

  # ───────────────────────────── 0 · 2.0
  - id: v20
    sheet: "0"
    ver: "2.0"
    eon: e1
    color: "#CDBF9C"
    status: done
    precision: exact
    deps: []
    name: { ru: "Новый мир", en: "A New World" }
    when: { ru: "август — октябрь 2026", en: "August — October 2026" }
    goal:
      ru: "Глобальное обновление, с которого всё началось: новая графика, прогулка от первого лица по любой точке планеты, династии, летопись и подробная статистика."
      en: "The global update where it all began: new graphics, first-person walks anywhere on the planet, dynasties, a chronicle and detailed statistics."
    why:
      ru: "Это нулевой лист — точка отсчёта. Всё, что ниже, строится на том, что уже работает в игре."
      en: "Sheet zero is the datum line. Everything below is built on what already works in the game."
    hood:
      ru: "Климат: модель испарения и переноса влаги ветром, муссоны и дождевая тень, океанские течения по модели Стоммела, льды и парниковый эффект. Природа: 19 биомов по схеме Уиттекера, 35 видов животных с моделью «хищник — жертва». Общество: численность по клеткам, знать — поимённо, до 24 000 персонажей с родословными."
      en: "Climate: evaporation and wind-borne moisture, monsoons and rain shadows, Stommel-model ocean currents, ice and greenhouse forcing. Nature: 19 Whittaker biomes and 35 species with predator–prey dynamics. Society: population per cell, nobility tracked by name — up to 24,000 characters with family trees."
    items:
      - k: sim
        s: done
        ru: ["Живой климат", "Испарение, ветра, муссоны, дождевая тень, океанские течения, ледники и CO₂."]
        en: ["Living climate", "Evaporation, winds, monsoons, rain shadows, ocean currents, ice sheets and CO₂."]
      - k: sim
        s: done
        ru: ["Природа", "19 биомов и 35 видов животных: вымирание, миграции и одомашнивание."]
        en: ["Nature", "19 biomes and 35 animal species: extinction, migration and domestication."]
      - k: sim
        s: done
        ru: ["Цивилизации", "Шесть эпох, десять форм правления, войны, флоты, колонии и ядерное оружие."]
        en: ["Civilisations", "Six eras, ten forms of government, wars, fleets, colonies and nuclear weapons."]
      - k: sim
        s: done
        ru: ["Династии", "Родословные, характеры и навыки правителей, выборы, перевороты, войны за наследство."]
        en: ["Dynasties", "Family trees, rulers’ traits and skills, elections, coups and wars of succession."]
      - k: walk
        s: done
        ru: ["Прогулка от первого лица", "В любой клетке мира: погода, день и ночь, жители, оружие своей эпохи."]
        en: ["First-person walks", "In any cell of the world: weather, day and night, locals, weapons of the era."]
      - k: com
        s: done
        ru: ["Моды и Мастерская Steam", "Редактор модов прямо в игре: сценарии, биомы, животные, модели и баланс."]
        en: ["Mods and Steam Workshop", "An in-game mod editor: scenarios, biomes, animals, models and balance."]

  # ───────────────────────────── I · 2.1
  - id: v21
    sheet: "I"
    ver: "2.1"
    eon: e1
    color: "#E2B157"
    status: wip
    now: true
    precision: exact
    deps: [v20]
    name: { ru: "Пути сообщения", en: "Connections" }
    when: { ru: "ноябрь 2026", en: "November 2026" }
    goal:
      ru: "Мир обзаводится инфраструктурой — портами, железными дорогами, аэропортами и военными базами, а прогулка — работой, деньгами, законом и поручениями жителей."
      en: "The world gains infrastructure — ports, railways, airports and military bases — and walk mode gains jobs, money, law and quests from the locals."
    why:
      ru: "Большая часть уже собрана и работает в тестовой сборке. Задача листа — доделать, отполировать и выпустить, попутно исправив несостыковки эпох, которые новые системы сделали заметнее."
      en: "Most of it is already built and running in the test build. This sheet is about finishing, polishing and shipping — and fixing the era inconsistencies the new systems make more visible."
    hood:
      ru: "Новые системы прогулки подключаются к ядру через реестры и не трогают старый код. Исправление «лошадей до приручения»: проверять не номер эпохи, а то, какие животные приручены державой и изобретено ли колесо; там, где коней нет, — ламы и верблюды. Моровые корабли должны переносить эпидемии через море."
      en: "The new walk-mode systems hook into the core through registries without touching old code. The ‘horses before domestication’ fix: check which animals a state has actually tamed and whether it knows the wheel, instead of the era number; where there are no horses — llamas and camels. Plague ships should carry epidemics across the sea."
    items:
      - k: sim
        s: wip
        ru: ["Флоты и морская война", "Блокады, перехват десантов, морские сражения и торговые морские пути."]
        en: ["Fleets and naval war", "Blockades, intercepted landings, sea battles and maritime trade lanes."]
      - k: walk
        s: wip
        ru: ["Морские порты", "14 типов судов, палубы, по которым можно ходить, работа в доках."]
        en: ["Seaports", "14 ship types, walkable decks, work at the docks."]
      - k: walk
        s: wip
        ru: ["Железные дороги", "От паровоза до маглева: станции, переезды, можно ехать или вести поезд."]
        en: ["Railways", "From steam to maglev: stations, crossings — ride as a passenger or drive the train."]
      - k: walk
        s: wip
        ru: ["Аэропорты", "Лайнеры, винтовые самолёты, истребители и вертолёты, парашют, работа пилота."]
        en: ["Airports", "Airliners, prop planes, fighters and helicopters, parachutes, a pilot’s job."]
      - k: walk
        s: wip
        ru: ["Военные базы", "От деревянного частокола до базы будущего; техника от колесниц до танков, служба."]
        en: ["Military bases", "From a wooden stockade to a base of the future; vehicles from chariots to tanks; enlisting."]
      - k: walk
        s: wip
        ru: ["Деньги и работа", "Валюты держав — от шкур до кредитов, лавки, подработки и репутация."]
        en: ["Money and work", "State currencies — from hides to credits — shops, odd jobs and reputation."]
      - k: walk
        s: wip
        ru: ["Закон и порядок", "Розыск, стража, полиция, штрафы, награды за голову и помилование."]
        en: ["Law and order", "Wanted levels, guards, police, fines, bounties and pardons."]
      - k: walk
        s: wip
        ru: ["Поручения жителей", "12 видов квестов из событий мира: голод, мор, разбойники, война, поиск родни."]
        en: ["Quests from locals", "12 quest types born from world events: famine, plague, bandits, war, lost relatives."]
      - k: sim
        s: plan
        ru: ["Лошади — только после приручения", "Кони, колесницы и повозки появляются, когда держава их действительно приручила и знает колесо."]
        en: ["Horses only after taming", "Horses, chariots and carts appear once a state has actually tamed them and knows the wheel."]

  # ───────────────────────────── II · 2.2
  - id: v22
    sheet: "II"
    ver: "2.2"
    eon: e1
    color: "#EDCF7E"
    status: plan
    precision: exact
    deps: [v21]
    name: { ru: "Голос сообщества", en: "Community Voice" }
    when: { ru: "декабрь 2026 — январь 2027", en: "December 2026 — January 2027" }
    goal:
      ru: "Быстро закрыть самые частые просьбы игроков — всё, что не требует перестройки движка."
      en: "Quickly deliver the most frequent player requests — everything that doesn’t require rebuilding the engine."
    why:
      ru: "Каждый пункт здесь — от нескольких часов до пары дней работы, а польза для игроков большая. Обновление держит темп, пока готовится большая перестройка движка."
      en: "Each item takes from a few hours to a couple of days, yet players get a lot out of it. The update keeps momentum while the big engine rebuild is being prepared."
    hood:
      ru: "Внутренняя «сила» бедствия пересчитывается в настоящие шкалы и обратно — для ползунка. Поиск пути кораблей начинает учитывать морской лёд, а лёд — сезоны. Кратер — понижение рельефа, которое со временем выравнивается к окружению, заполняется водой и зарастает."
      en: "A disaster’s internal ‘power’ is mapped to real scales and back for the slider. Ship pathfinding starts respecting sea ice, and ice follows the seasons. A crater is a dent in the terrain that relaxes towards its surroundings over time, fills with water and greens over."
    items:
      - k: play
        s: plan
        req: true
        ru: ["Карточки бедствий", "Наведите на ураган или пожар — сила, площадь, осадки, ущерб и сколько ещё продлится."]
        en: ["Disaster cards", "Hover a hurricane or a wildfire to see strength, area, rainfall, damage and time remaining."]
      - k: play
        s: plan
        req: true
        ru: ["Реальные шкалы", "Ураганы по Саффиру — Симпсону, вулканы по VEI, землетрясения по магнитуде, удары — в килотоннах."]
        en: ["Real-world scales", "Hurricanes on Saffir–Simpson, volcanoes on VEI, earthquakes by magnitude, impacts in kilotons."]
      - k: play
        s: plan
        req: true
        ru: ["Отклонение температуры", "Вместо средней температуры суши — насколько теплее или холоднее начала игры."]
        en: ["Temperature anomaly", "Instead of average land temperature — how much warmer or colder than at the start."]
      - k: sim
        s: plan
        req: true
        ru: ["Замерзающие моря", "Лёд закрывает путь кораблям; сезонные окна навигации и замёрзшие проливы."]
        en: ["Freezing seas", "Ice blocks ships; seasonal navigation windows and frozen straits."]
      - k: sim
        s: plan
        req: true
        ru: ["Кратеры", "Метеориты и ядерные удары оставляют кратеры, которые заполняются водой и со временем зарастают."]
        en: ["Craters", "Meteors and nukes leave craters that fill with water and slowly heal over time."]
      - k: gfx
        s: plan
        req: true
        ru: ["Новые палитры карты", "Эпохи и показатели различимы с первого взгляда, режим для дальтоников, тонкие стрелки ветра."]
        en: ["New map palettes", "Eras and indicators distinct at a glance, a colour-blind mode, slimmer wind barbs."]
      - k: play
        s: plan
        req: true
        ru: ["Переименование", "Державы, города, правители и формы правления — свои названия, цвета и флаги."]
        en: ["Renaming", "States, cities, rulers and forms of government — your own names, colours and flags."]
      - k: com
        s: wip
        ru: ["Дневник разработки", "Этот сайт: дорожная карта и новости с разработки."]
        en: ["Development journal", "This site: the roadmap and news from development."]

  # ───────────────────────────── III · 3.0
  - id: v30
    sheet: "III"
    ver: "3.0"
    eon: e1
    color: "#B9A27C"
    status: plan
    precision: approx
    deps: [v22]
    name: { ru: "Фундамент", en: "Foundation" }
    when: { ru: "февраль — март 2027", en: "February — March 2027" }
    goal:
      ru: "Перестроить движок под большие планы: мир становится шаром, симуляция — быстрой и предсказуемой, а код — готовым к сети и другим планетам."
      en: "Rebuild the engine for the big plans: the world becomes a globe, the simulation fast and predictable, the code ready for networking and other planets."
    why:
      ru: "Самый важный лист. Мультиплеер, другие планеты и «живые» жители невозможно надстроить поверх однопоточного мира, существующего в единственном экземпляре. Чем позже это сделать, тем больше кода придётся переписывать, поэтому — сейчас, пока его меньше всего."
      en: "The most important sheet. Multiplayer, other planets and ‘living’ inhabitants can’t be built on top of a single-threaded, one-of-a-kind world. The later it’s done, the more code must be rewritten — so it’s now, while there is least of it."
    hood:
      ru: "Симуляция переезжает в отдельный поток (Web Worker): состояние мира — типизированные массивы в общей памяти, рендер читает их без копирования. Каждое действие игрока — команда с номером тика; единый генератор случайности с зерном и фиксированный шаг дают воспроизводимую историю. Мир становится объектом: в памяти может жить несколько миров. Технологии, здания, техника и товары описываются таблицами данных — их же читают моды. Сохранения получают цепочку миграций версий. three.js обновляется до современной версии с прицелом на WebGPU. Симуляцию можно запускать без интерфейса в Node.js — для автотестов, а позже и для сервера."
      en: "The simulation moves to its own thread (Web Worker): world state lives in typed arrays in shared memory, and the renderer reads them without copying. Every player action becomes a command stamped with a tick; one seeded random generator and a fixed step make history reproducible. The world becomes an object, so several worlds can live in memory. Technologies, buildings, vehicles and goods are described in data tables that mods can read too. Saves get a chain of version migrations. three.js is updated to a modern release with WebGPU in mind. The simulation can run headless in Node.js — for automated tests now, and for the server later."
    items:
      - k: sim
        s: plan
        ru: ["Мир-глобус", "Карта замыкается по долготе, площади клеток учитывают широту, в 3D — настоящая планета из космоса."]
        en: ["A globe", "The map wraps east–west, cell areas follow latitude, and 3D shows a real planet from orbit."]
      - k: sim
        s: plan
        ru: ["Земля по реальным высотам", "Карта «Земля» строится по настоящим данным рельефа суши и дна океана."]
        en: ["Earth from real elevation", "The Earth map is built from real land and ocean-floor elevation data."]
      - k: eng
        s: plan
        ru: ["Симуляция в отдельном потоке", "Интерфейс и прогулка не тормозят; ускорение ×100 и выше."]
        en: ["Simulation on its own thread", "The UI and walk mode stay smooth; speeds of ×100 and beyond."]
      - k: eng
        s: plan
        ru: ["Большие миры", "Карты примерно до 500×250 клеток и смена размера без перезапуска игры."]
        en: ["Bigger worlds", "Maps up to roughly 500×250 cells, resized without restarting the game."]
      - k: eng
        s: plan
        ru: ["Предсказуемая история", "Одно зерно — одна история: повторы, воспроизводимые ошибки и основа мультиплеера."]
        en: ["Reproducible history", "One seed, one history: replays, reproducible bugs and the basis for multiplayer."]
      - k: eng
        s: plan
        ru: ["Данные вместо кода", "Технологии, здания, техника и товары — в таблицах; моды получают доступ ко всему."]
        en: ["Data, not code", "Technologies, buildings, vehicles and goods live in tables that mods can reach."]
      - k: eng
        s: plan
        ru: ["Сохранения нового формата", "Старые миры переносятся автоматически, сколько бы версий ни прошло."]
        en: ["New save format", "Old worlds migrate automatically, however many versions later."]
      - k: gfx
        s: plan
        ru: ["Новый рендер", "Свежий three.js: атмосфера с рассеянием света, вода с пеной, мягкие тени, цветокоррекция."]
        en: ["New renderer", "A fresh three.js: atmospheric scattering, foamy water, soft shadows, colour grading."]
      - k: com
        s: plan
        ru: ["Переводы сообществом", "Таблицы строк вместо встроенного текста — дорога к немецкому, испанскому, китайскому и другим."]
        en: ["Community translations", "String tables instead of inline text — the road to German, Spanish, Chinese and more."]

  # ───────────────────────────── IV · 3.1
  - id: v31
    sheet: "IV"
    ver: "3.1"
    eon: e1
    color: "#A9B66C"
    status: plan
    precision: approx
    deps: [v30]
    name: { ru: "Древо знаний", en: "Tree of Knowledge" }
    when: { ru: "II квартал 2027", en: "Q2 2027" }
    goal:
      ru: "Вместо одного числа «технологии» — настоящее древо открытий. Всё в мире, от повозок до архитектуры, следует тому, что этот народ уже знает."
      en: "Instead of a single ‘technology’ number — a real tree of discoveries. Everything in the world, from carts to architecture, follows what this people actually knows."
    why:
      ru: "Одежда жителей, товары в лавках, техника армий, профессии и здания — всё ссылается на знания державы. Без древа каждая следующая система снова привязывалась бы к номеру эпохи, как вышло с лошадьми."
      en: "Clothing, shop goods, army equipment, professions and buildings all refer to what a state knows. Without the tree, every new system would again key off the era number — as happened with horses."
    hood:
      ru: "Открытия образуют граф зависимостей; вес каждого направления зависит от условий державы — рельефа, ресурсов, войн, торговли, культуры. Эпоха становится следствием набора открытий, а не порогом числа. Прогулка, 3D-карта, лавки и армии спрашивают «знает ли держава X», а не «какая сейчас эпоха»."
      en: "Discoveries form a dependency graph; each direction is weighted by the state’s conditions — terrain, resources, wars, trade, culture. An era becomes a consequence of discoveries rather than a numeric threshold. Walk mode, the 3D map, shops and armies ask ‘does this state know X’, not ‘what era is it’."
    items:
      - k: sim
        s: plan
        ru: ["Древо из ~150 открытий", "Шесть ветвей: хозяйство, ремесло, мореходство, военное дело, наука и общество."]
        en: ["A tree of ~150 discoveries", "Six branches: economy, crafts, seafaring, warfare, science and society."]
      - k: sim
        s: plan
        ru: ["Больше эпох", "Между античностью и индустриальной эпохой появятся средневековье и Новое время."]
        en: ["More eras", "The Middle Ages and the early modern era fill the gap between antiquity and industry."]
      - k: sim
        s: plan
        ru: ["Свой путь у каждого народа", "Степняки раньше приручат коня, островитяне раньше освоят мореходство."]
        en: ["Every people finds its own path", "Steppe folk tame the horse first, islanders master the sea first."]
      - k: play
        s: plan
        req: true
        ru: ["Окно исследований", "У любой державы видно, что изучено, что изучается сейчас и что в планах."]
        en: ["Research window", "For any state: what has been learned, what is being studied and what comes next."]
      - k: sim
        s: plan
