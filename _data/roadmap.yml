# Дорожная карта Earth Simulator — звёздная карта на главной.
# Каждое обновление (phase) — звёздная система, каждый пункт (item) — планета на её орбите.
#
# Как обновлять:
#   * статус пункта: s: done | wip | plan | idea   (в игре / в работе / запланировано / задумка)
#     готовые планеты на карте светятся, в работе — наполовину
#   * статус обновления: status (те же значения); now: true — метка «Вы здесь» (ровно у одного)
#   * пункт, о котором просили игроки: req: true (подсвечивается фильтром «Идеи игроков»)
#   * k — направление: sim, walk, play, eng, gfx, com (названия ниже, в tracks)
#   * t — дата в долях года (2027.5 = середина 2027) — по ней строится шкала времени внизу карты
#   * pos — место системы на карте: x 0…1400 (слева направо — время), y 0…640 (выше — ближе к звёздам)
#   * img — скриншот в карточке обновления (необязательно)
#   * grows — «Что станет глубже»: как обновление развивает уже существующие механики (работа, лавки, закон…)
# Каждый пункт: ru: [заголовок, пояснение], en: [title, description]

status:
  done: { ru: "в игре", en: "in the game" }
  wip: { ru: "в работе", en: "in progress" }
  plan: { ru: "запланировано", en: "planned" }
  idea: { ru: "задумка", en: "concept" }

tracks:
  sim: { ru: "Симуляция", en: "Simulation" }
  walk: { ru: "Прогулка", en: "Walk mode" }
  play: { ru: "Игрок", en: "Player" }
  eng: { ru: "Движок", en: "Engine" }
  gfx: { ru: "Графика", en: "Graphics" }
  com: { ru: "Сообщество", en: "Community" }

eons:
  - id: e1
    roman: "I"
    color: "#D9A75B"
    name: { ru: "Мир людей", en: "The Human World" }
    span: { ru: "2026 — 2027", en: "2026 — 2027" }
    label: { x: 560, y: 92 }
  - id: e2
    roman: "II"
    color: "#6FB39E"
    name: { ru: "Мир живого", en: "The Living World" }
    span: { ru: "2028", en: "2028" }
    label: { x: 880, y: 560 }
  - id: e3
    roman: "III"
    color: "#8E9BD8"
    name: { ru: "Мир звёзд", en: "The World of Stars" }
    span: { ru: "2028 →", en: "2028 →" }
    label: { x: 1120, y: 58 }

phases:

  # ───────────────────────────── 2.0
  - id: v20
    ver: "2.0"
    eon: e1
    color: "#E8D3A2"
    status: done
    t: 2026.76
    pos: { x: 95, y: 330 }
    deps: []
    img: /assets/img/shots/walk-volaria-1600.jpg
    name: { ru: "Новый мир", en: "A New World" }
    when: { ru: "октябрь 2026", en: "October 2026" }
    goal:
      ru: "Глобальное обновление, с которого всё началось: новая графика, прогулка от первого лица по любой точке планеты, династии, летопись и подробная статистика."
      en: "The global update where it all began: new graphics, first-person walks anywhere on the planet, dynasties, a chronicle and detailed statistics."
    why:
      ru: "Точка отсчёта. Всё остальное строится на том, что уже работает в игре."
      en: "The starting point. Everything else is built on what already works in the game."
    hood:
      ru: "Климат: испарение и перенос влаги ветром, муссоны и дождевая тень, океанские течения по модели Стоммела, льды и парниковый эффект. Природа: 19 биомов по схеме Уиттекера, 35 видов животных с моделью «хищник — жертва». Общество: численность по клеткам, знать — поимённо, до 24 000 персонажей с родословными."
      en: "Climate: evaporation and wind-borne moisture, monsoons and rain shadows, Stommel-model ocean currents, ice and greenhouse forcing. Nature: 19 Whittaker biomes and 35 species with predator–prey dynamics. Society: population per cell, nobility tracked by name — up to 24,000 characters with family trees."
    items:
      - k: sim
        s: done
        ru: ["Живой климат", "Испарение, ветра, муссоны, дождевая тень, океанские течения, ледники и CO₂."]
        en: ["Living climate", "Evaporation, winds, monsoons, rain shadows, ocean currents, ice sheets and CO₂."]
      - k: sim
        s: done
        ru: ["Природа", "19 биомов и 35 видов животных: вымирание, миграции и одомашнивание."]
        en: ["Nature", "19 biomes and 35 animal species: extinction, migration and domestication."]
      - k: sim
        s: done
        ru: ["Цивилизации", "Шесть эпох, десять форм правления, войны, флоты, колонии и ядерное оружие."]
        en: ["Civilisations", "Six eras, ten forms of government, wars, fleets, colonies and nuclear weapons."]
      - k: sim
        s: done
        ru: ["Династии", "Родословные, характеры и навыки правителей, выборы, перевороты, войны за наследство."]
        en: ["Dynasties", "Family trees, rulers’ traits and skills, elections, coups and wars of succession."]
      - k: walk
        s: done
        ru: ["Прогулка от первого лица", "В любой клетке мира: погода, день и ночь, жители, транспорт и оружие своей эпохи."]
        en: ["First-person walks", "In any cell of the world: weather, day and night, locals, vehicles and weapons of the era."]
      - k: gfx
        s: done
        ru: ["Новая графика и музыка", "Рельеф, динамическая вода, смена дня и ночи; музыка подстраивается под эпоху."]
        en: ["New graphics and music", "Terrain, dynamic water, day and night; music adapts to the era."]
      - k: com
        s: done
        ru: ["Мастерская Steam", "Редактор модов прямо в игре: карты из картинок, сценарии, животные, модели и баланс."]
        en: ["Steam Workshop", "An in-game mod editor: maps from images, scenarios, animals, models and balance."]

  # ───────────────────────────── 2.1
  - id: v21
    ver: "2.1"
    eon: e1
    color: "#E8B65E"
    status: done
    t: 2026.79
    pos: { x: 205, y: 250 }
    deps: [v20]
    img: /assets/devlog/2026-10-15-update-2-1-0/container-port-1600.jpg
    name: { ru: "Транспорт, деньги и закон", en: "Transport, Money and the Law" }
    when: { ru: "15 октября 2026", en: "15 October 2026" }
    goal:
      ru: "Мир обзавёлся железными дорогами, портами, аэропортами и военными базами, а прогулка — работой, деньгами, законом и поручениями жителей. Игра заговорила на 17 языках."
      en: "The world gained railways, ports, airports and military bases, and walk mode gained jobs, money, law and quests from the locals. The game now speaks 17 languages."
    why:
      ru: "Работа, деньги, закон и поручения появились здесь в первой версии — как основа: каждое следующее обновление делает их глубже. Тексты игры вынесены в словари — с этого обновления она переведена на 17 языков."
      en: "Jobs, money, law and quests appeared here in a first version — as a foundation that every following update deepens. The game’s texts moved into dictionaries — since this update it is translated into 17 languages."
    hood:
      ru: "Новые системы прогулки — порты, рельсы, аэропорты, базы, деньги, закон — подключаются к ядру через реестры и не трогают старый код. Корабли в портах ходят по тем же морским путям, что и на карте мира, а морские бои берутся из настоящих сражений симуляции. Все строки интерфейса идут через словари: русский текст — ключ, переводы лежат в отдельных файлах по языкам."
      en: "The new walk-mode systems — ports, rails, airports, bases, money, law — hook into the core through registries without touching old code. Ships in ports follow the same sea lanes as on the world map, and naval battles come from real battles in the simulation. Every interface string goes through dictionaries: the Russian text is the key, translations live in per-language files."
    items:
      - k: walk
        s: done
        ru: ["Железные дороги", "От паровоза до магнитного поезда: пассажиром, угнать локомотив или работать машинистом; кабины и вагоны изнутри."]
        en: ["Railways", "From steam engines to maglev: ride as a passenger, steal a locomotive or work as a driver; cabs and coaches inside."]
      - k: walk
        s: done
        ru: ["Аэропорты", "Полёты пассажиром в другие аэропорты мира, работа пилотом; угонщика перехватят истребители — придётся прыгать с парашютом."]
        en: ["Airports", "Fly as a passenger to other airports of the world, work as a pilot; hijackers get intercepted — time for the parachute."]
      - k: walk
        s: done
        ru: ["Морские порты", "Торговые суда приходят и уходят; по палубе можно ходить, работать в порту и говорить с экипажем."]
        en: ["Seaports", "Merchant ships arrive and depart; walk the deck, work at the docks and talk to the crew."]
      - k: sim
        s: done
        ru: ["Морские сражения", "Флоты, блокады и десанты — бой можно смотреть с берега и с палубы."]
        en: ["Naval battles", "Fleets, blockades and landings — watch from the shore or from the deck."]
      - k: walk
        s: done
        ru: ["Военные базы", "От частокола до базы будущего: служба, караул, угон танков и самолётов."]
        en: ["Military bases", "From a stockade to a base of the future: service, guard duty, stealing tanks and planes."]
      - k: walk
        s: done
        ru: ["Деньги и работа", "Валюты держав — от шкур до кредитов, подработки, лавки и слава, которую можно исправить."]
        en: ["Money and work", "State currencies — from hides to credits — side jobs, shops and a reputation you can mend."]
      - k: walk
        s: done
        ru: ["Закон и порядок", "Правитель во дворце под охраной, розыск до пяти звёзд, полиция на машинах, штрафы и помилование."]
        en: ["Law and order", "A guarded ruler in a palace, wanted levels up to five stars, police cars, fines and pardons."]
      - k: walk
        s: done
        ru: ["Поручения жителей", "Задания из событий мира: голод, мор, разбойники, война, урожай."]
        en: ["Quests from locals", "Quests born from world events: famine, plague, bandits, war, harvest."]
      - k: com
        s: done
        req: true
        ru: ["17 языков", "Китайский, японский, корейский, немецкий, французский, испанский, португальский, польский, турецкий, итальянский, украинский, чешский, тайский, вьетнамский и другие."]
        en: ["17 languages", "Chinese, Japanese, Korean, German, French, Spanish, Portuguese, Polish, Turkish, Italian, Ukrainian, Czech, Thai, Vietnamese and more."]
      - k: play
        s: done
        req: true
        ru: ["Свои названия и флаги", "Переименуйте державы, города, правителей, династии, народы и веры; нарисуйте державе свой флаг."]
        en: ["Your own names and flags", "Rename states, cities, rulers, dynasties, peoples and faiths; draw your own flag for any state."]
      - k: play
        s: done
        ru: ["Назначение клавиш", "Любое действие — на любую клавишу; подсказки в игре показывают ваши клавиши."]
        en: ["Key bindings", "Any action on any key; in-game hints show your keys."]

  # ───────────────────────────── 2.2
  - id: v22
    ver: "2.2"
    eon: e1
    color: "#EDD08A"
    status: plan
    now: true
    t: 2026.88
    pos: { x: 305, y: 365 }
    deps: [v21]
    name: { ru: "Достоверность", en: "Fidelity" }
    when: { ru: "≈ ноябрь 2026", en: "≈ November 2026" }
    goal:
      ru: "На прогулке видно ровно то, до чего дошла держава: её животные, транспорт, оружие и постройки. Бедствия получают настоящие масштабы и следы, моря — лёд, карта — новые краски и больше сведений, а игрок — больше власти над миром."
      en: "On foot you see exactly what a state has reached: its animals, vehicles, weapons and buildings. Disasters get real scales and lasting marks, seas get ice, the map gets new colours and more information, and the player gets more control over the world."
    why:
      ru: "С поездами, портами и базами на прогулке стало видно гораздо больше техники, и несостыковки эпох бросаются в глаза: меч из бронзы у народа, который не знает бронзы, всадники в городах, где ещё не приручили лошадь. Всё это делается на нынешнем движке: данные о приручённых животных и изобретениях держав в симуляции уже есть."
      en: "With trains, ports and bases, walk mode now shows far more technology, and era mismatches stand out: a bronze sword among people who don’t know bronze, riders in towns that haven’t tamed the horse. All of it can be done on the current engine: the simulation already tracks each state’s tamed animals and inventions."
    hood:
      ru: "Прогулка спрашивает у симуляции не номер эпохи, а что держава действительно знает: каких из восьми одомашниваемых видов приручила (это уже считается — у каждой державы свои, по её землям) и какие из 32 изобретений сделала — письменность, колесо, бронзу, мореходство, порох, двигатель. Внутренняя «сила» бедствия пересчитывается в настоящие шкалы. Поиск морского пути учитывает лёд, а лёд — сезоны. Кратер со временем выравнивается, заполняется водой и зарастает. Закрепить можно любое поле мира, а не только температуру."
      en: "Walk mode asks the simulation not for the era number but for what a state actually knows: which of the eight domesticable species it has tamed (already tracked — each state has its own, by its lands) and which of 32 inventions it has made — writing, the wheel, bronze, seafaring, gunpowder, the engine. A disaster’s internal ‘power’ is mapped to real scales. Sea pathfinding respects ice, and ice follows the seasons. A crater levels out over time, fills with water and greens over. Any world field can be pinned, not just temperature."
    items:
      - k: walk
        s: plan
        req: true
        ru: ["Технологии на прогулке", "Кони и повозки — только после приручения и колеса; там, где коня нет, — свои верблюды, ламы или олени. Мечи, корабли, письмена на вывесках и постройки — по изобретениям державы."]
        en: ["Technology you can see", "Horses and carts only after taming and the wheel; where there are no horses — the state’s own camels, llamas or reindeer. Swords, ships, writing on signs and buildings follow its inventions."]
      - k: walk
        s: plan
        req: true
        ru: ["Техника в битвах как в армии", "В сражениях — те же танки и машины, что на базах державы; угнать технику можно прямо с поля боя."]
        en: ["Battle vehicles match the army", "Battles use the same tanks and vehicles as the state’s bases; steal them right off the battlefield."]
      - k: play
        s: plan
        req: true
        ru: ["Закрепить что угодно", "Постоянной можно сделать не только температуру, но и осадки, уровень моря, CO₂ и другое — и снять закрепление."]
        en: ["Pin anything", "Hold not just temperature but rainfall, sea level, CO₂ and more fixed — and release it again."]
      - k: play
        s: plan
        req: true
        ru: ["Реки своими руками", "Кисть рек: проложите русло — вода сама найдёт путь к морю, а вдоль реки поднимутся поля и города."]
        en: ["Rivers by hand", "A river brush: draw a channel and the water finds its way to the sea, with fields and towns rising along it."]
      - k: play
        s: plan
        req: true
        ru: ["Торговые пути на виду", "Окно каждого торгового маршрута: кто с кем торгует, сколько и что везут."]
        en: ["Trade routes up close", "A window for every trade route: who trades with whom, how much and what they carry."]
      - k: play
        s: plan
        req: true
        ru: ["Значки на карте", "Включайте и выключайте значки городов, баз, аэропортов и портов на 2D-карте."]
        en: ["Map icons", "Toggle the icons of cities, bases, airports and ports on the 2D map."]
      - k: sim
        s: plan
        ru: ["Мор плывёт на кораблях", "Эпидемии переходят за море вместе с торговыми и военными судами."]
        en: ["Plague travels by ship", "Epidemics cross the sea with merchant and war ships."]
      - k: play
        s: plan
        req: true
        ru: ["Карточки бедствий", "Наведите на ураган или пожар — сила, площадь, осадки, ущерб и сколько ещё продлится."]
        en: ["Disaster cards", "Hover a hurricane or a wildfire to see strength, area, rainfall, damage and time remaining."]
      - k: sim
        s: plan
        req: true
        ru: ["Настоящие шкалы", "Ураганы по Саффиру — Симпсону, вулканы по VEI, землетрясения по магнитуде, удары — в килотоннах."]
        en: ["Real-world scales", "Hurricanes on Saffir–Simpson, volcanoes on VEI, earthquakes by magnitude, impacts in kilotons."]
      - k: sim
        s: plan
        req: true
        ru: ["Замерзающие моря", "Лёд закрывает путь кораблям: сезонные окна навигации и замёрзшие проливы."]
        en: ["Freezing seas", "Ice blocks ships: seasonal navigation windows and frozen straits."]
      - k: sim
        s: plan
        req: true
        ru: ["Кратеры", "Метеориты и ядерные удары оставляют кратеры, которые заполняются водой и со временем зарастают."]
        en: ["Craters", "Meteors and nukes leave craters that fill with water and slowly heal over time."]
      - k: gfx
        s: plan
        req: true
        ru: ["Руины как руины", "Разрушенные дома и стены выглядят обломками, обгоревшими каркасами и завалами, а не просто тёмными коробками."]
        en: ["Ruins that look ruined", "Destroyed houses and walls look like rubble, burnt frames and debris, not just dark boxes."]
      - k: play
        s: plan
        req: true
        ru: ["Отклонение температуры", "Вместо средней температуры суши — насколько теплее или холоднее начала мира."]
        en: ["Temperature anomaly", "Instead of average land temperature — how much warmer or colder than at the start."]
      - k: gfx
        s: plan
        req: true
        ru: ["Новые краски карты", "Эпохи и показатели различимы с первого взгляда, режим для дальтоников, свои цвета держав."]
        en: ["New map colours", "Eras and indicators distinct at a glance, a colour-blind mode, your own state colours."]
      - k: play
        s: plan
        req: true
        ru: ["Удобнее интерфейс", "Поиск по державам и городам, понятнее окна и подсказки — по вашим отзывам."]
        en: ["A friendlier interface", "Search for states and cities, clearer windows and hints — from your feedback."]

  # ───────────────────────────── 2.3
  - id: v23
    ver: "2.3"
    eon: e1
    color: "#E6C474"
    status: plan
    t: 2026.96
    pos: { x: 360, y: 470 }
    deps: [v22]
    name: { ru: "Дороги и небо", en: "Roads and Sky" }
    when: { ru: "≈ декабрь 2026", en: "≈ December 2026" }
    goal:
      ru: "Пути на прогулке совпадают с картой, по ним ездят автобусы и фуры, на границах стоят посты, а в небе идут воздушные бои."
      en: "Roads on foot match the map, buses and lorries run on them, borders get checkpoints, and the sky gets air battles."
    why:
      ru: "Последнее обновление на нынешнем движке. Сюда собраны идеи, которые просятся сразу после 2.1 и не требуют перестройки: транспорт, границы и воздушная война. Оно намеренно небольшое: каждая новая система до 3.0 — это код, который потом переносить на новую основу."
      en: "The last update on the current engine. It gathers the ideas that follow naturally from 2.1 and need no rebuild: transport, borders and air war. It is deliberately small: every new system before 3.0 is code that has to be moved onto the new base later."
    hood:
      ru: "Дороги и рельсы прогулки прокладываются по той же сети, что на карте мира, — вокзалы стоят на концах настоящих линий. Граница державы проводится по водоразделам и рекам, где они рядом; на пересечении с дорогой появляется пост. Воздушный бой — новый вид сражения в симуляции, рядом с сухопутным и морским, с самолётами по эпохе."
      en: "Walk-mode roads and rails follow the same network as the world map — stations sit at the ends of real lines. A state border follows watersheds and rivers where they are close; where it crosses a road, a checkpoint appears. An air battle is a new kind of battle in the simulation, beside land and naval ones, with aircraft by era."
    grows:
      ru:
        - "Работа: водитель автобуса и дальнобойщик рядом с машинистом и пилотом."
        - "Закон: на границе спрашивают документы, а контрабанда становится преступлением."
      en:
        - "Jobs: bus driver and long-haul trucker beside train driver and pilot."
        - "Law: border guards ask for papers, and smuggling becomes a crime."
    items:
      - k: walk
        s: plan
        req: true
