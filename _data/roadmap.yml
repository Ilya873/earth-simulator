        ru: ["Правитель от первого лица", "Тронный зал, указы, назначения, объявление войны, приём послов."]
        en: ["Rule in first person", "A throne room, decrees, appointments, declarations of war, receiving envoys."]
      - k: play
        s: plan
        ru: ["Правление как в стратегии", "Управляйте любой державой с карты: экономика, армия, дипломатия, наука."]
