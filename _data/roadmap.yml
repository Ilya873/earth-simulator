        en: ["Your fight matters", "Not just casualties: a hill held, a banner saved or a fallen general change the outcome of the battle on the map."]
      - k: play
        s: plan
        ru: ["Армии в ваших руках", "Как в RTS: правитель сам ведёт армии — маршруты, осады, высадки."]
