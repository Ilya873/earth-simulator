  # ───────────────────────────── 2.1
  - id: v21
    ver: "2.1"
    eon: e1
    color: "#E8B65E"
    status: done
    t: 2026.79
    pos: { x: 190, y: 205 }
    deps: [v20]
    img: /assets/devlog/2026-10-15-update-2-1-0/container-port-1600.jpg
    name: { ru: "Транспорт, деньги и закон", en: "Transport, Money and the Law" }
    when: { ru: "15 октября 2026", en: "15 October 2026" }
    goal:
      ru: "Мир обзавёлся железными дорогами, портами, аэропортами и военными базами, а прогулка — работой, деньгами, законом и поручениями жителей. Игра заговорила на 17 языках."
      en: "The world gained railways, ports, airports and military bases, and walk mode gained jobs, money, law and quests from the locals. The game now speaks 17 languages."
    why:
      ru: "Работа, деньги, закон и поручения появились здесь в первой версии — как основа: каждое следующее обновление делает их глубже. Тексты игры вынесены в словари — с этого обновления она переведена на 17 языков."
      en: "Jobs, money, law and quests appeared here in a first version — as a foundation that every following update deepens. The game’s texts moved into dictionaries — since this update it is translated into 17 languages."
    hood:
      ru: "Новые системы прогулки — порты, рельсы, аэропорты, базы, деньги, закон — подключаются к ядру через реестры и не трогают старый код. Корабли в портах ходят по тем же морским путям, что и на карте мира, а морские бои берутся из настоящих сражений симуляции. Все строки интерфейса идут через словари: русский текст — ключ, переводы лежат в отдельных файлах по языкам."
      en: "The new walk-mode systems — ports, rails, airports, bases, money, law — hook into the core through registries without touching old code. Ships in ports follow the same sea lanes as on the world map, and naval battles come from real battles in the simulation. Every interface string goes through dictionaries: the Russian text is the key, translations live in per-language files."
    items:
      - k: walk
        s: done
        ru: ["Железные дороги", "От паровоза до магнитного поезда: пассажиром, угнать локомотив или работать машинистом; кабины и вагоны изнутри."]
        en: ["Railways", "From steam engines to maglev: ride as a passenger, steal a locomotive or work as a driver; cabs and coaches inside."]
      - k: walk
        s: done
        ru: ["Аэропорты", "Полёты пассажиром в другие аэропорты мира, работа пилотом; угонщика перехватят истребители — придётся прыгать с парашютом."]
        en: ["Airports", "Fly as a passenger to other airports of the world, work as a pilot; hijackers get intercepted — time for the parachute."]
      - k: walk
        s: done
        ru: ["Морские порты", "Торговые суда приходят и уходят; по палубе можно ходить, работать в порту и говорить с экипажем."]
        en: ["Seaports", "Merchant ships arrive and depart; walk the deck, work at the docks and talk to the crew."]
      - k: sim
        s: done
        ru: ["Морские сражения", "Флоты, блокады и десанты — бой можно смотреть с берега и с палубы."]
        en: ["Naval battles", "Fleets, blockades and landings — watch from the shore or from the deck."]
      - k: walk
        s: done
        ru: ["Военные базы", "От частокола до базы будущего: служба, караул, угон танков и самолётов."]
        en: ["Military bases", "From a stockade to a base of the future: service, guard duty, stealing tanks and planes."]
      - k: walk
        s: done
        ru: ["Деньги и работа", "Валюты держав — от шкур до кредитов, подработки, лавки и слава, которую можно исправить."]
        en: ["Money and work", "State currencies — from hides to credits — side jobs, shops and a reputation you can mend."]
      - k: walk
        s: done
        ru: ["Закон и порядок", "Правитель во дворце под охраной, розыск до пяти звёзд, полиция на машинах, штрафы и помилование."]
        en: ["Law and order", "A guarded ruler in a palace, wanted levels up to five stars, police cars, fines and pardons."]
      - k: walk
        s: done
        ru: ["Поручения жителей", "Задания из событий мира: голод, мор, разбойники, война, урожай."]
        en: ["Quests from locals", "Quests born from world events: famine, plague, bandits, war, harvest."]
      - k: com
        s: done
        ru: ["17 языков", "Китайский, японский, корейский, немецкий, французский, испанский, португальский, польский, турецкий, итальянский, украинский, чешский, тайский, вьетнамский и другие."]
        en: ["17 languages", "Chinese, Japanese, Korean, German, French, Spanish, Portuguese, Polish, Turkish, Italian, Ukrainian, Czech, Thai, Vietnamese and more."]
      - k: play
        s: done
        req: true
        ru: ["Свои названия и флаги", "Переименуйте державы, города, правителей, династии, народы и веры; нарисуйте державе свой флаг."]
        en: ["Your own names and flags", "Rename states, cities, rulers, dynasties, peoples and faiths; draw your own flag for any state."]
      - k: play
        s: done
        ru: ["Назначение клавиш", "Любое действие — на любую клавишу; подсказки в игре показывают ваши клавиши."]
        en: ["Key bindings", "Any action on any key; in-game hints show your keys."]

  # ───────────────────────────── 2.2
  - id: v22
    ver: "2.2"
    eon: e1
    color: "#EDD08A"
    status: plan
    now: true
    t: 2026.88
    pos: { x: 285, y: 390 }
    deps: [v21]
    name: { ru: "Достоверность", en: "Fidelity" }
    when: { ru: "≈ ноябрь 2026", en: "≈ November 2026" }
    goal:
      ru: "На прогулке видно ровно то, до чего дошла держава: её животные, транспорт, оружие и постройки, а города переходят в новую эпоху постепенно, дом за домом. Дома можно разрушить, в режиме «Выживание» появляются голод и жажда, а на прогулке — новое оружие и лечение. Бедствия получают настоящие масштабы и следы, моря — лёд, карта — новые краски и больше сведений."
      en: "On foot you see exactly what a state has reached: its animals, vehicles, weapons and buildings, and towns move into a new era gradually, house by house. Houses can be destroyed, Survival mode gets hunger and thirst, and walk mode gets new weapons and healing. Disasters get real scales and lasting marks, seas get ice, the map gets new colours and more information."
    why:
      ru: "С поездами, портами и базами на прогулке стало видно гораздо больше техники, и несостыковки эпох бросаются в глаза: меч из бронзы у народа, который не знает бронзы, всадники в городах, где ещё не приручили лошадь. Всё это делается на нынешнем движке: данные о приручённых животных и изобретениях держав в симуляции уже есть. Бедствия, моря и краски карты, скорее всего, будут готовы в ноябре."
      en: "With trains, ports and bases, walk mode now shows far more technology, and era mismatches stand out: a bronze sword among people who don’t know bronze, riders in towns that haven’t tamed the horse. All of it can be done on the current engine: the simulation already tracks each state’s tamed animals and inventions. Disasters, seas and map colours will most likely be ready in November."
    hood:
      ru: "Прогулка спрашивает у симуляции не номер эпохи, а что держава действительно знает: каких из восьми одомашниваемых видов приручила (это уже считается — у каждой державы свои, по её землям) и какие из 58 изобретений сделала — письменность, колесо, бронзу, мореходство, порох, двигатель. Внутренняя «сила» бедствия пересчитывается в настоящие шкалы. Поиск морского пути учитывает лёд, а лёд — сезоны. Кратер со временем выравнивается, заполняется водой и зарастает. Закрепить можно любое поле мира, а не только температуру. У каждого дома свой «год перестройки», вычисляемый из его номера: когда держава входит в новую эпоху, город обновляется постепенно, и хранить для этого ничего не нужно. Так же, по своему «году», сменяется транспорт на улицах. Разрушенный дом запоминается и перестраивается отдельно от квартала. Оружие, предметы и здания эпох переезжают в таблицы данных, а сохранения получают цепочку миграций — первые части фундамента 3.0."
      en: "Walk mode asks the simulation not for the era number but for what a state actually knows: which of the eight domesticable species it has tamed (already tracked — each state has its own, by its lands) and which of 58 inventions it has made — writing, the wheel, bronze, seafaring, gunpowder, the engine. A disaster’s internal ‘power’ is mapped to real scales. Sea pathfinding respects ice, and ice follows the seasons. A crater levels out over time, fills with water and greens over. Any world field can be pinned, not just temperature. Every house has its own ‘rebuild year’ derived from its number: when a state enters a new era the town renews gradually, with nothing extra to store. Vehicles on the streets change the same way, each by its own ‘year’. A destroyed house is remembered and rebuilt separately from its block. Weapons, items and buildings of every era move into data tables, and saves get a chain of migrations — the first parts of the 3.0 foundation."
    grows:
      ru:
        - "Лавки: лекарь продаёт травы, бинты и аптечки, оружейник — гранаты и новое оружие; в режиме «Выживание» еда и вода нужны по-настоящему."
        - "Бои: разрушенный дом остаётся развалинами, а солдаты, павшие от вашей руки, вычитаются из армии на карте."
      en:
        - "Shops: the healer sells herbs, bandages and medkits, the gunsmith grenades and new weapons; in Survival mode food and water truly matter."
        - "Battles: a destroyed house stays in ruins, and soldiers who fall by your hand are subtracted from the army on the map."
    items:
      - k: walk
        s: done
        req: true
        ru: ["Технологии на прогулке", "Кони и повозки — только после приручения и колеса, а где коня нет — верблюды, ламы или олени. Мечи, корабли, вывески и постройки — по изобретениям державы; на полях — пахарь с волами, жатка или комбайн; в век небоскрёбов не ходят парусники."]
        en: ["Technology you can see", "Horses and carts only after taming and the wheel; where there are no horses — camels, llamas or reindeer. Swords, ships, signs and buildings follow the state’s inventions; fields get oxen ploughs, reapers or combines; no sailing ships in the age of skyscrapers."]
      - k: walk
        s: done
        ru: ["Постепенная смена эпох", "Город переходит в новую эпоху дом за домом, а улицы — повозка за повозкой: старые постройки и старый транспорт соседствуют с новыми, а не меняются все разом."]
        en: ["Eras change gradually", "A town enters a new era house by house, and its streets cart by cart: old buildings and old vehicles stand beside new ones instead of all changing at once."]
      - k: walk
        s: plan
        req: true
        ru: ["Бои как в армии", "В сражениях — те же танки и машины, что на базах державы, окопы, ежи и блиндажи; технику можно угнать с поля боя, а павшие от вашей руки вычитаются из армии на карте."]
        en: ["Battles like the real army", "Battles use the same tanks and vehicles as the state’s bases, with trenches, hedgehogs and dugouts; steal vehicles off the battlefield, and those who fall by your hand are subtracted from the army on the map."]
      - k: walk
        s: wip
        ru: ["Разрушения и руины", "Танк, взрыв или пожар превращают дом в развалины, где на карте горит — на прогулке огонь и дым; руины выглядят обломками и обгоревшими каркасами, а не тёмными коробками."]
        en: ["Destruction and ruins", "A tank, a blast or a fire turns a house into ruins; where the map burns, walk mode shows fire and smoke; ruins look like rubble and burnt frames, not dark boxes."]
      - k: play
        s: plan
        req: true
        ru: ["Голод и жажда", "В режиме «Выживание» нужно есть и пить, а жара и холод зависят от климата; обычный режим остаётся спокойным."]
        en: ["Hunger and thirst", "In Survival mode you need to eat and drink, and heat and cold follow the local climate; Standard mode stays relaxed."]
      - k: walk
        s: plan
        req: true
        ru: ["Новое оружие и лечение", "Гранаты, дробовики и снайперские винтовки; травы, бинты и аптечки — по эпохе."]
        en: ["New weapons and healing", "Grenades, shotguns and sniper rifles; herbs, bandages and medkits — by era."]
      - k: play
        s: plan
        ru: ["Торговые пути на виду", "Окно каждого торгового маршрута: кто с кем торгует, сколько и что везут."]
        en: ["Trade routes up close", "A window for every trade route: who trades with whom, how much and what they carry."]
      - k: walk
        s: wip
        ru: ["Дирижабли и воздушные шары", "Дирижабли над городами индустриальной эпохи, а позже — прогулочные шары над полями и рекламные дирижабли; угнать можно и их."]
        en: ["Airships and balloons", "Airships over industrial-era cities, and later pleasure balloons over the fields and advertising blimps; you can steal those too."]
      - k: sim
        s: plan
        req: true
        ru: ["Реалистичные бедствия", "Карточки бедствий при наведении, настоящие шкалы — Саффир — Симпсон, VEI, магнитуда, килотонны — и кратеры, которые заполняются водой и зарастают."]
        en: ["Realistic disasters", "Disaster cards on hover, real-world scales — Saffir–Simpson, VEI, magnitude, kilotons — and craters that fill with water and heal over."]
      - k: sim
        s: plan
        req: true
        ru: ["Моря замерзают, мор плывёт", "Лёд закрывает путь кораблям, проливы замерзают по сезонам, а эпидемии переходят за море вместе с судами."]
        en: ["Freezing seas, sailing plagues", "Ice blocks ships and straits freeze by season, while epidemics cross the sea aboard ships."]
      - k: play
        s: plan
        ru: ["Власть над миром", "Закрепите не только температуру, но и осадки, уровень моря, CO₂ — и снимите закрепление; кисть рек: проложите русло — вода сама найдёт путь к морю."]
        en: ["Power over the world", "Pin not just temperature but rainfall, sea level, CO₂ — and release them; a river brush: draw a channel and the water finds its way to the sea."]
      - k: play
        s: wip
        req: true
        ru: ["Карта понятнее", "Значки городов, баз и портов включаются и выключаются, отклонение температуры от начала мира, новые краски и режим для дальтоников, поиск по державам и городам."]
        en: ["A clearer map", "Toggle icons of cities, bases and ports, temperature anomaly since the start, new colours and a colour-blind mode, search for states and cities."]

  # ───────────────────────────── 2.3
  - id: v23
    ver: "2.3"
    eon: e1
    color: "#EFB25C"
    status: plan
    t: 2026.96
    pos: { x: 375, y: 215 }
    deps: [v22]
    name: { ru: "Правитель", en: "The Ruler" }
    when: { ru: "≈ декабрь 2026", en: "≈ December 2026" }
    goal:
      ru: "Станьте правителем любой державы. Ведите её с карты, как в стратегии, — или спуститесь во дворец и правьте от первого лица: слушайте советников, принимайте послов, отдавайте указы с трона. Ваша держава живёт в том же мире, что и остальные, по тем же правилам, — но важные решения в ней принимаете вы."
      en: "Become the ruler of any state. Lead it from the map like a strategy game — or go down to the palace and rule in first person: hear your counsellors, receive envoys, issue decrees from the throne. Your state lives in the same world as the others, by the same rules — but the big decisions are yours."
    why:
      ru: "Об этом просят чаще всего, и для первой версии в игре уже есть всё нужное: державы с армиями и союзами, войны, вассалы, правители с династиями и родословными, дворец под охраной из 2.1. А дальше власть правителя будет расти: законы, партии и идеологии придут в 3.3, бюджет и налоги — в 3.4, армии, которые вы ведёте сами, — в 3.5."
      en: "It is the most requested feature, and the game already has everything the first version needs: states with armies and alliances, wars, vassals, rulers with dynasties and family trees, the guarded palace from 2.1. And the ruler’s power keeps growing: laws, parties and ideologies arrive in 3.3, the budget and taxes in 3.4, armies you lead yourself in 3.5."
    hood:
      ru: "Каждое важное решение державы — объявить войну, заключить мир или союз, взять вассала, сменить курс, перенести столицу — становится приказом. За остальные державы приказы отдаёт ИИ, за вашу — вы, поэтому ваша держава подчиняется тем же правилам, что и все. Те же приказы потом станут основой мультиплеера. Интерьер собирается, когда вы входите в здание, — по его типу, эпохе и культуре, так что слабому ПК он ничего не стоит."
      en: "Every major decision of a state — declaring war, making peace or an alliance, taking a vassal, changing course, moving the capital — becomes an order. The AI gives the orders for the other states and you give them for yours, so your state obeys the same rules as everyone else. The same orders later become the basis of multiplayer. An interior is built when you step inside — from the building’s type, era and culture — so it costs a weak PC nothing."
    grows:
      ru:
        - "Дворец и стража из 2.1 становятся вашими: караул охраняет вас, а заговорщики приходят за вами."
        - "Прогулка: из дворца можно выйти в свою столицу — и в ней знают, кто вы."
      en:
        - "The palace and guards from 2.1 become yours: the watch guards you, and conspirators come for you."
        - "Walk mode: step out of the palace into your capital — where people know who you are."
    items:
      - k: play
        s: plan
        req: true
        ru: ["Правление как в стратегии", "Выберите любую державу и ведите её с карты: война и мир, союзы и вассалы, направление главного удара, перенос столицы. Игру можно поставить на паузу и подумать."]
        en: ["Rule like a strategy game", "Pick any state and lead it from the map: war and peace, alliances and vassals, the main thrust, moving the capital. Pause the game to think things over."]
      - k: play
        s: plan
        ru: ["Курс державы", "Расширение, развитие, армия или вера: курс решает, на что держава тратит силы, — и видно, как это сказывается на ней."]
        en: ["The state’s course", "Expansion, development, army or faith: the course decides where the state spends its strength — and you see what it does to it."]
      - k: play
        s: plan
        req: true
        ru: ["Правитель от первого лица", "Тронный зал во дворце: сядьте на трон, принимайте посетителей и отдавайте указы прямо в мире."]
        en: ["Rule in first person", "A throne room in the palace: take the throne, receive visitors and issue decrees right in the world."]
      - k: walk
        s: plan
        ru: ["Советники", "Полководец, казначей, посол и жрец докладывают о делах державы и советуют — прислушаться или нет, решаете вы."]
        en: ["Counsellors", "A general, a treasurer, an envoy and a priest report on the state’s affairs and give advice — whether to listen is up to you."]
      - k: play
        s: plan
        ru: ["Послы", "Другие державы присылают послов: союз, мир, дань или ультиматум. Ответ — за вами, и соседи его запомнят."]
        en: ["Envoys", "Other states send envoys: an alliance, peace, tribute or an ultimatum. The answer is yours, and the neighbours will remember it."]
      - k: play
        s: plan
        ru: ["Династия", "Умер правитель — играете за наследника из той же династии, что видна в родословной."]
        en: ["Dynasty", "When the ruler dies you play the heir from the same dynasty shown in the family tree."]
      - k: play
        s: plan
        ru: ["Смута", "Проигранная война, голод или чужая вера могут обернуться восстанием или переворотом — трон придётся удержать."]
        en: ["Unrest", "A lost war, famine or a foreign faith can turn into a revolt or a coup — and you will have to hold on to the throne."]
      - k: walk
        s: plan
        req: true
        ru: ["Интерьеры", "Первые здания с дверьми: дворец, дом, таверна, лавка и храм — у каждой эпохи и культуры свои."]
        en: ["Interiors", "The first buildings with doors: palace, house, tavern, shop and temple — each era and culture its own."]
      - k: play
        s: plan
        ru: ["Летопись правления", "Ваши войны, союзы и реформы записываются в летопись державы; за правление — свои достижения."]
        en: ["Chronicle of your reign", "Your wars, alliances and reforms go into the state’s chronicle; your reign earns achievements of its own."]

  # ───────────────────────────── 2.4
  - id: v24
    ver: "2.4"
    eon: e1
    color: "#E6C474"
    status: plan
    t: 2027.08
    pos: { x: 440, y: 480 }
    deps: [v22]
    name: { ru: "Дороги, небо и закон", en: "Roads, Sky and Law" }
    when: { ru: "≈ январь — февраль 2027", en: "≈ January — February 2027" }
    goal:
      ru: "Дороги на прогулке совпадают с картой, между городами идут трассы, по ним ездят автобусы и фуры. Границы тянутся по хребтам и рекам, на них стоят посты. В небе — воздушные бои и летающие машины будущего. Города выглядят по климату, народу и вере. А у закона появляются тюрьмы — и пираты на морских путях."
      en: "Roads on foot match the map, highways link cities, and buses and lorries run on them. Borders follow ridges and rivers, with checkpoints. The sky gets air battles and the flying cars of the future. Cities look the way their climate, people and faith make them. And the law gets prisons — with pirates on the sea lanes."
    why:
      ru: "Автобусам и фурам нужны дороги, которые совпадают с картой, — поэтому они приходят вместе с единой сетью путей. Тюрьмы, ограбления и пираты продолжают закон и моря из 2.1, а воздушные бои — небо с самолётами и вертолётами. Это последнее большое обновление перед 3.0."
      en: "Buses and lorries need roads that match the map, so they arrive together with the single road network. Prisons, robbery and pirates continue the law and the seas of 2.1, and air battles continue the sky with its planes and helicopters. This is the last big update before 3.0."
    hood:
      ru: "Дороги и рельсы прогулки прокладываются по той же сети, что на карте мира, — вокзалы стоят на концах настоящих линий. Граница державы проводится по водоразделам и рекам, где они рядом; на пересечении с дорогой появляется пост. Воздушный бой — новый вид сражения в симуляции, рядом с сухопутным и морским, с самолётами по эпохе. Тюрьма — разновидность военной базы со своим назначением, пиратский корабль — экипаж из морских боёв на торговых путях. Облик домов выбирается по климату клетки (глина, срубы, камень, сваи, юрты) и по народу и вере. Работа водителя, дальнобойщика и пограничника описывается правилами-данными — так после 3.0 будут описаны все работы."
      en: "Walk-mode roads and rails follow the same network as the world map — stations sit at the ends of real lines. A state border follows watersheds and rivers where they are close; where it crosses a road, a checkpoint appears. An air battle is a new kind of battle in the simulation, beside land and naval ones, with aircraft by era. A prison is a kind of military base with its own purpose; a pirate ship is a crew from the naval battles on the trade lanes. House style follows the cell’s climate (adobe, logs, stone, stilts, yurts) and the people and faith. The driver’s, trucker’s and border guard’s jobs are described as data rules — the way all jobs will be after 3.0."
    grows:
      ru:
        - "Работа: водитель автобуса и дальнобойщик рядом с машинистом и пилотом."
        - "Закон: на границе спрашивают документы, а контрабанда становится преступлением; вместо мгновенного штрафа — тюрьма, из которой можно бежать."
      en:
        - "Jobs: bus driver and long-haul trucker beside train driver and pilot."
        - "Law: border guards ask for papers, smuggling becomes a crime, and instead of an instant fine there is prison — which you can escape."
    items:
      - k: walk
        s: plan
        ru: ["Единая сеть путей", "Дороги, трассы между городами и железные дороги на прогулке совпадают с картой; вокзал есть у каждой линии."]
        en: ["One road network", "Roads, highways between cities and railways on foot match the world map; every line has its stations."]
      - k: walk
        s: plan
        ru: ["Автобусы", "Городские и междугородние маршруты: поездки пассажиром и работа водителем."]
        en: ["Buses", "City and intercity routes: ride as a passenger or work as a driver."]
      - k: walk
        s: plan
        ru: ["Дальнобойщики", "Фуры с грузом между городами — и работа дальнобойщиком."]
        en: ["Long-haul trucks", "Lorries carrying cargo between cities — and a trucker’s job."]
      - k: sim
        s: plan
        ru: ["Естественные границы", "Границы держав тянутся по хребтам и рекам, а не режут горы пополам."]
        en: ["Natural borders", "State borders follow ridges and rivers instead of cutting mountains in half."]
      - k: walk
        s: plan
        ru: ["Пограничные посты", "На границе — шлагбаум, пограничники и проверка документов."]
        en: ["Border checkpoints", "At the border — a barrier, border guards and a check of papers."]
      - k: sim
        s: plan
        ru: ["Воздушные бои", "Воздушные и совместные сражения — небо, земля и море; от бипланов и бомбардировщиков до машин будущего."]
        en: ["Air battles", "Air and combined battles — sky, land and sea; from biplanes and bombers to aircraft of the future."]
      - k: gfx
        s: plan
        req: true
        ru: ["Города по климату, народу и вере", "Глина и песчаник в пустынях, срубы в тайге, камень в горах, сваи на болотах, юрты в степи; храмы, святилища, тотемы, крыши и украшения — по народу и вере."]
        en: ["Cities by climate, people and faith", "Adobe and sandstone in deserts, log houses in the taiga, stone in mountains, stilts in marshes, yurts on the steppe; temples, shrines, totems, roofs and ornament by people and faith."]
      - k: walk
        s: plan
        req: true
        ru: ["Летающие машины", "В эпоху будущего машины действительно летают — над улицами и между городами."]
        en: ["Flying cars", "In the era of the future cars really fly — over streets and between cities."]
      - k: walk
        s: plan
        req: true
        ru: ["Тюрьмы и лагеря", "От ямы и частокола до тюрьмы с вышками: отсидите срок — и розыск снят, или бегите — и он растёт."]
        en: ["Prisons and camps", "From a pit and a stockade to a prison with towers: serve your time and the wanted level clears, or escape and it grows."]
      - k: walk
        s: plan
        ru: ["Ограбление", "Ограбить лавку или караван можно, но охрана, свидетели и розыск делают это риском, а не заработком."]
        en: ["Robbery", "You can rob a shop or a caravan, but guards, witnesses and the wanted level make it a gamble, not a living."]
      - k: walk
        s: plan
        req: true
        ru: ["Пираты", "Одиночные пиратские корабли на торговых путях; наймитесь к ним или поднимите чёрный флаг на угнанном корабле."]
        en: ["Pirates", "Lone pirate ships on the trade lanes; sign on with them or raise the black flag on a stolen ship."]

  # ───────────────────────────── 3.0
  - id: v30
    ver: "3.0"
    eon: e1
    color: "#D9B98A"
    status: plan
    major: true
    t: 2027.2
    pos: { x: 500, y: 320 }
    deps: [v23, v24]
    name: { ru: "Фундамент", en: "Foundation" }
    when: { ru: "≈ март 2027", en: "≈ March 2027" }
    goal:
      ru: "Перестроить движок под большие планы: мир становится шаром, симуляция — быстрой и предсказуемой, а код — готовым к сети и другим планетам."
      en: "Rebuild the engine for the big plans: the world becomes a globe, the simulation fast and predictable, the code ready for networking and other planets."
    why:
      ru: "Самое важное обновление: от него тянутся связи почти ко всем остальным. Мультиплеер, другие планеты и живые жители невозможно надстроить поверх однопоточного мира, существующего в единственном экземпляре. Часть этой работы придёт раньше, вместе с обновлениями 2.2–2.4: таблицы данных, приказы держав, правила для работы. А в 3.0 остаётся то, что можно сделать только целиком: симуляция в отдельном потоке, мир-глобус, большие миры и новая графика."
      en: "The most important update: links run from it to almost all the others. Multiplayer, other planets and living inhabitants can’t be built on top of a single-threaded, one-of-a-kind world. Part of this work arrives earlier, with updates 2.2–2.4: data tables, state orders, rules for jobs. What’s left for 3.0 is what can only be done whole: the simulation on its own thread, the globe, bigger worlds and new graphics."
    hood:
      ru: "Симуляция переезжает в отдельный поток (Web Worker): состояние мира — типизированные массивы в общей памяти, рендер читает их без копирования. Каждое действие игрока — команда с номером тика; единый генератор случайности с зерном и фиксированный шаг дают воспроизводимую историю. Мир становится объектом — их может быть несколько. Технологии, здания, техника и товары описываются таблицами данных, которые читают и моды. Механики прогулки — работа, лавки, поручения — получают общий слой «фактов о мире» (что знает держава, её законы, климат клетки, достаток, войны) и правила с условиями на эти факты: так каждое следующее обновление углубляет их, добавляя факты и правила, а не переписывая код. Сохранения получают цепочку миграций. three.js обновляется с прицелом на WebGPU. Симуляцию можно запускать без интерфейса в Node.js — для автотестов, а позже для сервера. Каждая подсистема получает уровни подробности и бюджет времени: на слабом ПК — упрощённая симуляция, на мощном — полная."
      en: "The simulation moves to its own thread (Web Worker): world state lives in typed arrays in shared memory, read by the renderer without copying. Every player action becomes a command stamped with a tick; one seeded random generator and a fixed step make history reproducible. The world becomes an object — there can be several. Technologies, buildings, vehicles and goods are described in data tables that mods can read too. Walk-mode mechanics — jobs, shops, quests — get a shared layer of ‘world facts’ (what the state knows, its laws, the cell’s climate, wealth, wars) and rules with conditions on those facts: every following update deepens them by adding facts and rules rather than rewriting code. Saves get a chain of migrations. three.js is updated with WebGPU in mind. The simulation can run headless in Node.js — for automated tests now, and for the server later. Every subsystem gets levels of detail and a time budget: a simplified simulation on a weak PC, the full one on a strong one."
    grows:
      ru:
        - "Работа, лавки и поручения из 2.1 переходят на правила-данные — дальше каждое обновление добавляет им условия, не переписывая механику."
        - "Морская торговля и войны идут по глобусу: корабли огибают мир, а не упираются в край карты."
      en:
        - "Jobs, shops and quests from 2.1 move onto data rules — from then on every update adds conditions without rewriting the mechanic."
        - "Sea trade and wars span the globe: ships sail around the world instead of hitting the map edge."
    items:
      - k: sim
        s: plan
        ru: ["Мир-глобус", "Карта замыкается по долготе, площади клеток учитывают широту, в 3D — настоящая планета из космоса."]
        en: ["A globe", "The map wraps east–west, cell areas follow latitude, and 3D shows a real planet from orbit."]
      - k: sim
        s: plan
        ru: ["Земля по реальным высотам", "Карта «Земля» строится по настоящим данным рельефа суши и дна океана."]
        en: ["Earth from real elevation", "The Earth map is built from real land and ocean-floor elevation data."]
      - k: eng
        s: plan
        ru: ["Симуляция в отдельном потоке", "Интерфейс и прогулка не тормозят; ускорение ×100 и выше."]
        en: ["Simulation on its own thread", "The UI and walk mode stay smooth; speeds of ×100 and beyond."]
      - k: eng
        s: plan
        ru: ["Большие миры", "Карты примерно до 500×250 клеток и смена размера без перезапуска игры."]
        en: ["Bigger worlds", "Maps up to roughly 500×250 cells, resized without restarting the game."]
      - k: eng
        s: plan
        ru: ["Предсказуемая история", "Одно зерно — одна история: повторы, воспроизводимые ошибки и основа мультиплеера."]
        en: ["Reproducible history", "One seed, one history: replays, reproducible bugs and the basis for multiplayer."]
      - k: eng
        s: plan
        ru: ["Данные вместо кода", "Технологии, здания, техника и товары — в таблицах; моды получают доступ ко всему."]
        en: ["Data, not code", "Technologies, buildings, vehicles and goods live in tables that mods can reach."]
      - k: eng
        s: plan
        ru: ["Правила мира как данные", "Работа, профессии, лавки и поручения описываются условиями: эпоха и знания, климат, законы, достаток, война. Новые обновления добавляют условия, не переписывая механику."]
        en: ["World rules as data", "Jobs, professions, shops and quests are described by conditions: era and knowledge, climate, laws, wealth, war. New updates add conditions without rewriting the mechanic."]
      - k: eng
        s: plan
        ru: ["Новые сохранения", "Старые миры переносятся автоматически, сколько бы версий ни прошло."]
        en: ["New saves", "Old worlds migrate automatically, however many versions later."]
      - k: gfx
        s: plan
        ru: ["Новый рендер", "Свежий three.js: атмосфера с рассеянием света, вода с пеной, мягкие тени, цветокоррекция."]
        en: ["New renderer", "A fresh three.js: atmospheric scattering, foamy water, soft shadows, colour grading."]
      - k: com
        s: plan
        ru: ["Переводы от сообщества", "Словари уже вынесены в 2.1 — игроки смогут сами исправлять переводы и добавлять новые языки через Мастерскую."]
        en: ["Community translations", "The dictionaries already came out in 2.1 — players will be able to fix translations and add new languages through the Workshop."]
      - k: eng
        s: plan
        ru: ["Уровни симуляции", "Упрощённая симуляция для слабых ПК и полная для мощных — выбор в настройках, как качество графики."]
        en: ["Simulation levels", "A simplified simulation for weak PCs and a full one for strong PCs — chosen in settings, like graphics quality."]
      - k: sim
        s: plan
        ru: ["Атмосфера", "Давление, циклоны и облака рождаются из влажности и ветра; новый слой карты — давление."]
        en: ["Atmosphere", "Pressure, cyclones and clouds arise from moisture and wind; a new map layer shows pressure."]

  # ───────────────────────────── 3.1
  - id: v31
    ver: "3.1"
    eon: e1
    color: "#C9C27A"
    status: plan
    t: 2027.33
    pos: { x: 565, y: 180 }
    deps: [v30]
    name: { ru: "Бесконечное развитие", en: "Endless Development" }
    when: { ru: "≈ апрель — май 2027", en: "≈ April — May 2027" }
    goal:
      ru: "Вместо одного числа «технологии» — древо открытий без потолка, а с ним живые языки, культуры и веры. Державы идут разными путями, и космос — лишь одна из дорог, а не финиш для всех."
      en: "Instead of a single ‘technology’ number — a tree of discoveries with no ceiling, and with it living languages, cultures and faiths. States take different paths, and space is just one road, not everyone’s finish line."
    why:
      ru: "Одежда жителей, товары в лавках, техника армий, профессии и здания — всё ссылается на знания державы. Без древа каждая новая система снова привязывалась бы к номеру эпохи. Само древо — это таблицы данных из 3.0."
      en: "Clothing, shop goods, army equipment, professions and buildings all refer to what a state knows. Without the tree, every new system would again key off the era number. The tree itself is data tables from 3.0."
    hood:
      ru: "Открытия образуют граф зависимостей; вес каждого направления зависит от условий державы — рельефа, ресурсов, войн, торговли, культуры. Эпоха становится следствием открытий, а не порогом числа. Прогулка, 3D-карта, лавки и армии спрашивают «знает ли держава X», а не «какая сейчас эпоха». За известными открытиями древо продолжается сгенерированными — у каждой державы своими, с названиями на её языке. Язык — ветвь семьи с общим праязыком: у разошедшихся народов слова расходятся, имена городов и людей берутся из языка и меняются со временем, соседи заимствуют слова. Культуры расходятся и сливаются, веры раскалываются и реформируются."
      en: "Discoveries form a dependency graph; each direction is weighted by the state’s conditions — terrain, resources, wars, trade, culture. An era becomes a consequence of discoveries rather than a numeric threshold. Walk mode, the 3D map, shops and armies ask ‘does this state know X’, not ‘what era is it’. Beyond the known discoveries the tree continues with generated ones — different for every state, named in its own language. A language is a branch of a family with a common proto-language: when peoples drift apart so do their words, names of towns and people come from the language and change over time, and neighbours borrow words. Cultures split and merge; faiths schism and reform."
    grows:
      ru:
        - "Работа и лавки: профессии и товары открываются вместе с открытиями — кузнец с металлургией, механик с двигателем."
        - "Военные базы и транспорт: техника строго по знаниям державы."
      en:
        - "Jobs and shops: professions and goods unlock with discoveries — the smith with metallurgy, the mechanic with the engine."
        - "Military bases and vehicles: equipment strictly by what the state knows."
    items:
      - k: sim
        s: plan
        ru: ["Древо без потолка", "Около 150 известных открытий в шести ветвях — хозяйство, ремесло, мореходство, военное дело, наука, общество, — а за ними новые, которых не было в нашей истории."]
        en: ["A tree with no ceiling", "About 150 known discoveries in six branches — economy, crafts, seafaring, warfare, science, society — and beyond them new ones that never existed in our history."]
      - k: sim
        s: plan
        req: true
        ru: ["Больше эпох", "Средневековье и Новое время между античностью и индустрией, эпоха мировых войн — первые танки, винтовки, бипланы, панельные кварталы — перед современностью."]
        en: ["More eras", "The Middle Ages and the early modern era between antiquity and industry, and an age of world wars — first tanks, rifles, biplanes, prefab blocks — before the modern era."]
      - k: sim
        s: plan
        ru: ["Свой путь у каждого народа", "Степняки раньше приручат коня, островитяне раньше освоят мореходство."]
        en: ["Every people finds its own path", "Steppe folk tame the horse first, islanders master the sea first."]
      - k: play
        s: plan
        req: true
        ru: ["Окно исследований", "У любой державы видно, что изучено, что изучается сейчас и что в планах."]
        en: ["Research window", "For any state: what has been learned, what is being studied and what comes next."]
      - k: sim
        s: plan
        ru: ["Знания путешествуют", "Через торговлю, войны, переселенцев и шпионов; бывают утраченные технологии и тёмные века."]
        en: ["Knowledge travels", "Through trade, war, migrants and spies; technologies can be lost in dark ages."]
      - k: walk
        s: plan
        ru: ["Мир без анахронизмов", "Одежда, ремёсла, товары, профессии, транспорт и облик домов следуют древу знаний: новое открытие постепенно меняет то, что видно на улицах, — изучили двигатель, и среди повозок появляются первые машины."]
        en: ["A world without anachronisms", "Clothing, crafts, goods, professions, vehicles and houses follow the tree of knowledge: a new discovery gradually changes what you see in the streets — learn the engine, and the first cars appear among the carts."]
      - k: sim
        s: plan
        ru: ["Животные в хозяйстве", "Стада дают пищу, шерсть и тягловую силу, а верховая езда, колесницы и кочевое скотоводство становятся открытиями в древе."]
        en: ["Animals in the economy", "Herds provide food, wool and draught power, while riding, chariots and nomadic herding become discoveries in the tree."]
      - k: sim
        s: plan
        ru: ["Разведка недр", "Державы находят руду, уголь и нефть — и нефть на морском шельфе, — только когда умеют их искать и добывать; до того месторождения скрыты."]
        en: ["Prospecting", "States find ore, coal and oil — offshore oil too — only once they know how to search for and mine them; until then deposits stay hidden."]
      - k: sim
        s: plan
        ru: ["Транспортная сеть", "Дороги, рельсы и порты становятся настоящей сетью: по ней идут торговля и переселенцы, а позже — грузы и армии. Сейчас они только для красоты."]
        en: ["A transport network", "Roads, rails and ports become a real network carrying trade and migrants, and later cargo and armies. Today they are only decoration."]
      - k: sim
        s: plan
        ru: ["Языки", "Языковые семьи и диалекты: имена городов и людей берутся из языка, меняются со временем и заимствуются у соседей."]
        en: ["Languages", "Language families and dialects: names of towns and people come from the language, change over time and are borrowed from neighbours."]
      - k: sim
        s: plan
        ru: ["Культуры живут", "Народы расходятся и сливаются, перенимают обычаи у соседей и завоевателей."]
        en: ["Living cultures", "Peoples split and merge, and take up customs from neighbours and conquerors."]
      - k: sim
        s: plan
        ru: ["Расколы и реформы", "Веры делятся на течения, реформируются и угасают — у каждой своя история."]
        en: ["Schisms and reforms", "Faiths split into branches, reform and fade — each with a history of its own."]
      - k: sim
        s: plan
        ru: ["Открытие мира", "Держава знает только тех, кого встретила: соседей, тех, до кого доплыли её корабли и дошли караваны; воевать и торговать можно лишь с известными."]
        en: ["Discovering the world", "A state knows only those it has met: neighbours and those its ships and caravans have reached; it can trade and fight only with the known."]

  # ───────────────────────────── 3.2
  - id: v32
    ver: "3.2"
    eon: e1
    color: "#A8C48A"
    status: plan
    t: 2027.56
    pos: { x: 625, y: 302 }
    deps: [v31]
    name: { ru: "Живые люди", en: "Living People" }
    when: { ru: "≈ лето 2027", en: "≈ summer 2027" }
    goal:
      ru: "Каждый житель — человек со своей судьбой: имя, семья, работа, распорядок дня, память и история."
      en: "Every inhabitant is a person with a fate of their own: a name, family, job, daily routine, memory and story."
    why:
      ru: "Прогулка — самое необычное в игре. Постоянные люди с памятью нужны всему, что идёт дальше: карьере, вселению в любого человека, компаниям с владельцами и полководцам. А их ремёсла, одежда и быт берутся из древа знаний (3.1)."
      en: "Walk mode is the most unusual part of the game. Persistent people with memories are needed by everything that follows: careers, possessing anyone, companies with owners, generals. Their trades, clothing and daily life come from the tree of knowledge (3.1)."
    hood:
      ru: "Уровни детализации общества: вдали от игрока жители — статистика клетки, ближе — кварталы с семьями и профессиями, рядом — полноценные люди. Встреченный человек «материализуется» по зерну и дальше живёт постоянно, даже когда вы ушли. Поведение — ИИ на потребностях с расписаниями. Генератор интерьеров из 2.3 распространяется на все здания, а в комнатах появляются их жильцы."
      en: "Levels of detail for society: far from the player, people are cell statistics; closer — neighbourhoods of families and trades; nearby — full individuals. A person you meet ‘materialises’ from the seed and lives on permanently after you leave. Behaviour is needs-based AI with schedules. The interior generator from 2.3 extends to every building, and the rooms get their residents."
    grows:
      ru:
        - "Поручения рождаются из нужд конкретных людей, а не из списка."
        - "Ваши поступки на прогулке меняют город: помощь, преступления и торговля сказываются на его достатке и порядке."
      en:
        - "Quests come from the needs of specific people, not from a list."
        - "What you do on foot changes the town: help, crime and trade affect its wealth and order."
    items:
      - k: sim
        s: plan
        ru: ["Знания, чувства и желания", "У каждого жителя — то, что он знает и умеет, настроение, страхи и мечты; от них зависят его поступки."]
        en: ["Knowledge, feelings and wishes", "Every inhabitant has knowledge and skills, moods, fears and dreams that drive what they do."]
      - k: eng
        s: plan
        ru: ["Миллионы жителей", "Вдали — статистика клетки, ближе — семьи и кварталы, рядом — живые люди; встреченный человек остаётся в мире навсегда."]
        en: ["Millions of inhabitants", "Far away — cell statistics, closer — families and neighbourhoods, nearby — living people; someone you meet stays in the world for good."]
      - k: sim
        s: plan
        ru: ["У всего своя история", "Дома, корабли, мечи и ордена помнят, кто их сделал, кому принадлежали и через что прошли."]
        en: ["Everything has a history", "Houses, ships, swords and medals remember who made them, who owned them and what they went through."]
      - k: walk
        s: plan
        ru: ["Распорядок дня", "Работа, дом, рынок, таверна, храм; праздники, свадьбы и траур."]
        en: ["Daily routines", "Work, home, market, tavern, temple; feasts, weddings and mourning."]
      - k: walk
        s: plan
        ru: ["Память и отношения", "Жители помнят вашу помощь и обиды, а слухи о вас расходятся по городу."]
        en: ["Memory and relationships", "Locals remember your help and your wrongs, and rumours about you spread through town."]
      - k: sim
        s: plan
        ru: ["Жизнеописания простых людей", "Как у правителей сейчас: рождение, браки, ремесло, переезды и войны."]
        en: ["Biographies for commoners", "Like rulers have today: birth, marriage, trade, moves and wars."]
      - k: walk
        s: plan
        req: true
        ru: ["Жизнь внутри", "Интерьеры у всех зданий, от изб до заводов, — и в них живут, работают и празднуют."]
        en: ["Life indoors", "Interiors for every building, from huts to factories — where people live, work and celebrate."]
      - k: play
        s: plan
        req: true
        ru: ["Режим выживания", "Голод и жажда из 2.2 становятся полным выживанием: усталость, болезни, травмы и лечение."]
        en: ["Survival mode", "Hunger and thirst from 2.2 grow into full survival: fatigue, illness, injury and healing."]
      - k: walk
        s: plan
        ru: ["Добыча и ремесло", "Охота, собирательство, готовка и простое ремесло."]
        en: ["Gathering and crafting", "Hunting, foraging, cooking and simple crafting."]
      - k: walk
        s: plan
        ru: ["Стройка от первого лица", "Постройте дом, лавку или мастерскую своими руками — и они станут частью города."]
        en: ["Building in first person", "Build a house, a shop or a workshop with your own hands — and it becomes part of the town."]
      - k: walk
        s: plan
        ru: ["Профессии и карьера", "Ремёсла зависят от эпохи, климата и места; у игрока — карьера вместо разовых подработок."]
        en: ["Professions and careers", "Trades depend on the era, climate and place; the player gets a career instead of odd jobs."]
      - k: walk
        s: plan
        ru: ["Квесты из нужд жителей", "Цепочки поручений, последствия которых видны в городе и державе."]
        en: ["Quests from real needs", "Quest chains whose consequences show up in the town and the state."]
      - k: sim
        s: plan
        req: true
        ru: ["Эпидемии и вирусы", "Болезни со штаммами и переносчиками, карантины, лекари и вакцины."]
        en: ["Epidemics and viruses", "Diseases with strains and carriers, quarantines, healers and vaccines."]
      - k: gfx
        s: plan
        ru: ["Люди с лицами", "Lowpoly-персонажи с лицами и анимацией; одежда по культуре, климату и достатку."]
        en: ["People with faces", "Low-poly characters with faces and animation; clothing by culture, climate and wealth."]

  # ───────────────────────────── 3.3
  - id: v33
    ver: "3.3"
    eon: e1
    color: "#D99A78"
    status: plan
    t: 2027.68
    pos: { x: 730, y: 198 }
    deps: [v32, v23]
    name: { ru: "Власть и вера", en: "Power and Faith" }
    when: { ru: "≈ конец лета 2027", en: "≈ late summer 2027" }
    goal:
      ru: "Стать частью любой державы и пройти путь от простолюдина до правителя. Боги и идеологии начинают иметь значение."
      en: "Join any state and rise from commoner to ruler. Gods and ideologies start to matter."
    why:
      ru: "Чтобы подниматься по лестнице власти и вселяться в любого человека, нужны постоянные люди из 3.2. Идеологии и законы придают смысл решениям в экономике и войне, которые идут следом."
      en: "Climbing the ladder of power and possessing anyone requires the persistent people of 3.2. Ideologies and laws give meaning to the economic and military choices that follow."
    hood:
      ru: "Идеология — точка в пространстве осей (экономика, власть, вера, открытость), правительство — набор законов, партии — группы людей со схожими взглядами. Вселение — общий механизм: игрок берёт под контроль любую сущность с ролью, а при выходе её снова ведёт ИИ. Вера копит «память о богах»: проявления силы над землями культа рождают божеств пантеона."
      en: "An ideology is a point in a space of axes (economy, authority, faith, openness); a government is a set of laws; parties are groups of people with similar views. Possession is one general mechanism: the player takes over any entity with a role, and AI resumes when they leave. Faith accumulates a ‘memory of the gods’: displays of power over a cult’s lands give birth to deities."
    grows:
      ru:
        - "Работа и закон: идеология и законы решают, какие профессии разрешены, кто платит налоги и что считается преступлением."
        - "Деньги: валюты и цены зависят от политики державы."
        - "Правитель из 2.3 получает новые решения: законы, идеологию, отношения с партиями."
      en:
        - "Jobs and law: ideology and laws decide which trades are allowed, who pays taxes and what counts as a crime."
        - "Money: currencies and prices depend on the state’s policies."
        - "The ruler from 2.3 gets new decisions: laws, ideology, dealing with parties."
    items:
      - k: sim
        s: plan
        req: true
        ru: ["Идеологии", "Феодализм, либерализм, демократия, социализм, коммунизм, центризм, теократия, диктатуры — с сильными и слабыми сторонами."]
        en: ["Ideologies", "Feudalism, liberalism, democracy, socialism, communism, centrism, theocracy, dictatorships — with strengths and weaknesses."]
      - k: sim
        s: plan
        ru: ["Партии и законы", "Налоги, призыв, свобода слова, вера, торговля; фракции борются за влияние."]
        en: ["Parties and laws", "Taxes, conscription, free speech, religion, trade; factions fight for influence."]
      - k: play
        s: plan
        req: true
        ru: ["Подданство", "Вступите в любую нацию: дом, должность, налоги и защита."]
        en: ["Citizenship", "Join any nation: a home, a post, taxes and protection."]
      - k: play
        s: plan
        req: true
        ru: ["Путь к власти", "Переворот при феодализме, выборы в демократиях, партийная лестница в однопартийных режимах."]
        en: ["The road to power", "A coup under feudalism, elections in democracies, the party ladder in one-party states."]
      - k: play
        s: plan
        req: true
        ru: ["Вселение в любого человека", "Крестьянин, купец, полководец, пророк, вождь или король — играйте за кого угодно."]
        en: ["Possess anyone", "Peasant, merchant, general, prophet, chieftain or king — play as anyone."]
      - k: play
        s: plan
        req: true
        ru: ["Своё поселение — своя держава", "Построенное своими руками растёт в поселение, а поселение — в державу на карте."]
        en: ["Your settlement, your state", "What you build with your own hands grows into a settlement, and the settlement into a state on the map."]
      - k: sim
        s: plan
        req: true
        ru: ["Вера отвечает богу", "Часто бьёте молниями — рождается культ Громовержца; засухи, чудеса и кары создают пантеоны, пророков и ереси."]
        en: ["Faith answers the god", "Strike often with lightning and a Thunder God cult is born; droughts, miracles and wrath create pantheons, prophets and heresies."]
      - k: sim
        s: plan
        ru: ["Договоры", "Союзы, торговые соглашения, пакты о ненападении и границы как настоящие документы."]
        en: ["Treaties", "Alliances, trade agreements, non-aggression pacts and borders as real documents."]

  # ───────────────────────────── 3.4
  - id: v34
    ver: "3.4"
    eon: e1
    color: "#E2B04F"
    status: plan
    t: 2027.8
    pos: { x: 835, y: 312 }
    deps: [v31, v32, v33]
    name: { ru: "Капитал", en: "Capital" }
    when: { ru: "≈ осень 2027", en: "≈ autumn 2027" }
    goal:
      ru: "Экономика из настоящих товаров, цен и компаний, где подъёмы и кризисы возникают сами."
      en: "An economy of real goods, prices and companies, where booms and crises emerge on their own."
    why:
      ru: "Что можно производить, решает древо знаний (3.1). Компаниям нужны владельцы и работники (3.2). Бюджетом и налогами управляет правитель (2.3, 3.3). Поэтому экономика идёт после них."
      en: "What can be produced is decided by the tree of knowledge (3.1). Companies need owners and workers (3.2). Budgets and taxes are run by a ruler (2.3, 3.3). That’s why the economy comes after them."
    hood:
      ru: "Экономика на уровне фирм: у каждой есть владелец, работники, запасы и цены, а рынок в каждом регионе уравновешивает спрос и предложение. Товары — данные из таблиц 3.0. Перевозки идут по графу путей (дороги, рельсы, морские линии) с ограниченной пропускной способностью. Финансовый слой: кредит, ставка центробанка, акции как доли фирм."
      en: "A firm-level economy: each firm has an owner, workers, stock and prices, and every region’s market clears supply against demand. Goods are data from 3.0’s tables. Freight moves over a graph of routes (roads, rails, sea lanes) with limited capacity. A financial layer adds credit, a central bank rate and shares as stakes in firms."
    grows:
      ru:
        - "Работа становится наймом: вакансии и зарплаты — из рынка труда, работодатели — настоящие компании."
        - "Лавки и порты торгуют товарами из цепочек производства по ценам своего региона."
      en:
        - "Jobs become employment: vacancies and wages come from the labour market, employers are real companies."
        - "Shops and ports trade goods from supply chains at regional prices."
    items:
      - k: sim
        s: plan
        ru: ["Товары и цепочки производства", "Зерно, лес, руда, металл, ткани, топливо, станки, электроника."]
        en: ["Goods and supply chains", "Grain, timber, ore, metal, cloth, fuel, machine tools, electronics."]
      - k: sim
        s: plan
        ru: ["Рынки регионов", "Цены из спроса и предложения; грузы везут караваны, корабли, поезда и грузовики."]
        en: ["Regional markets", "Prices from supply and demand; cargo moves by caravan, ship, train and truck."]
      - k: play
        s: plan
        ru: ["Компании", "Частные и государственные — в земледелии, добыче, промышленности, торговле и транспорте: найм, конкуренция, банкротства; они двигают экономику державы. Основать свою можно и на прогулке, и как правитель."]
        en: ["Companies", "Private and state-owned — in farming, mining, industry, trade and transport: hiring, competition, bankruptcy; they drive the state’s economy. Found your own on foot or as a ruler."]
