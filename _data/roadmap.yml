  # ───────────────────────────── 3.4
  - id: v34
    ver: "3.4"
    eon: e1
    color: "#E2B04F"
    status: plan
    t: 2028.1
    pos: { x: 835, y: 312 }
    deps: [v31, v33]
    name: { ru: "Капитал", en: "Capital" }
    when: { ru: "≈ весна 2028", en: "≈ spring 2028" }
    goal:
      ru: "Экономика из настоящих товаров, цен и компаний, где подъёмы и кризисы возникают сами."
      en: "An economy of real goods, prices and companies, where booms and crises emerge on their own."
    why:
      ru: "Что можно производить, решает древо знаний (3.1). Компаниям нужны владельцы и работники (3.2). Бюджетом и налогами управляет правитель (3.3). Поэтому экономика идёт после них."
      en: "What can be produced is decided by the tree of knowledge (3.1). Companies need owners and workers (3.2). Budgets and taxes are run by a ruler (3.3). That’s why the economy comes after them."
    hood:
      ru: "Экономика на уровне фирм: у каждой есть владелец, работники, запасы и цены, а рынок в каждом регионе уравновешивает спрос и предложение. Товары — данные из таблиц 3.0. Перевозки идут по графу путей (дороги, рельсы, морские линии) с ограниченной пропускной способностью. Финансовый слой: кредит, ставка центробанка, акции как доли фирм."
      en: "A firm-level economy: each firm has an owner, workers, stock and prices, and every region’s market clears supply against demand. Goods are data from 3.0’s tables. Freight moves over a graph of routes (roads, rails, sea lanes) with limited capacity. A financial layer adds credit, a central bank rate and shares as stakes in firms."
    items:
      - k: sim
        s: plan
        ru: ["Товары и цепочки производства", "Зерно, лес, руда, металл, ткани, топливо, станки, электроника."]
        en: ["Goods and supply chains", "Grain, timber, ore, metal, cloth, fuel, machine tools, electronics."]
      - k: sim
        s: plan
        ru: ["Рынки регионов", "Цены из спроса и предложения; грузы везут караваны, корабли, поезда и грузовики."]
        en: ["Regional markets", "Prices from supply and demand; cargo moves by caravan, ship, train and truck."]
      - k: play
        s: plan
        ru: ["Свои компании", "Частные и государственные: найм, конкуренция, банкротства. Основать можно и на прогулке, и как правитель."]
        en: ["Your own companies", "Private and state-owned: hiring, competition, bankruptcy. Found one on foot or as a ruler."]
      - k: sim
        s: plan
        ru: ["Банки и биржи", "Кредит, инфляция, валюты, акции и дивиденды."]
        en: ["Banks and exchanges", "Credit, inflation, currencies, shares and dividends."]
      - k: sim
        s: plan
        ru: ["Кризисы и бумы", "Пузыри, паника, депрессии и гиперинфляция — следствие решений, а не случайность."]
        en: ["Crises and booms", "Bubbles, panics, depressions and hyperinflation — consequences, not dice rolls."]
      - k: play
        s: plan
        ru: ["Бюджет державы", "Налоги и расходы на армию, науку, дороги и людей — в руках игрока-правителя."]
        en: ["The state budget", "Taxes and spending on army, science, roads and people — in the player-ruler’s hands."]

