        en: ["Fronts and sieges", "Front lines, fortresses, trenches and dugouts, sieges and occupation."]
      - k: sim
        s: plan
        req: true
        ru: ["Снабжение и климат", "Склады и обозы; потери от голода, обморожения и жары."]
