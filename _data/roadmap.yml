    goal:
      ru: "Стать частью любой державы и пройти путь от простолюдина до правителя. Боги и идеологии начинают иметь значение."
      en: "Join any state and rise from commoner to ruler. Gods and ideologies start to matter."
    why:
      ru: "Чтобы подниматься по лестнице власти и вселяться в любого человека, нужны постоянные люди из 3.2. Идеологии и законы придают смысл решениям в экономике и войне, которые идут следом."
      en: "Climbing the ladder of power and possessing anyone requires the persistent people of 3.2. Ideologies and laws give meaning to the economic and military choices that follow."
    hood:
      ru: "Идеология — точка в пространстве осей (экономика, власть, вера, открытость), правительство — набор законов, партии — группы людей со схожими взглядами. Вселение — общий механизм: игрок берёт под контроль любую сущность с ролью, а при выходе её снова ведёт ИИ. Вера копит «память о богах»: проявления силы над землями культа рождают божеств пантеона."
      en: "An ideology is a point in a space of axes (economy, authority, faith, openness); a government is a set of laws; parties are groups of people with similar views. Possession is one general mechanism: the player takes over any entity with a role, and AI resumes when they leave. Faith accumulates a ‘memory of the gods’: displays of power over a cult’s lands give birth to deities."
    items:
      - k: sim
        s: plan
        req: true
        ru: ["Идеологии", "Феодализм, либерализм, демократия, социализм, коммунизм, центризм, теократия, диктатуры — с сильными и слабыми сторонами."]
        en: ["Ideologies", "Feudalism, liberalism, democracy, socialism, communism, centrism, theocracy, dictatorships — with strengths and weaknesses."]
      - k: sim
        s: plan
        ru: ["Партии и законы", "Налоги, призыв, свобода слова, вера, торговля; фракции борются за влияние."]
        en: ["Parties and laws", "Taxes, conscription, free speech, religion, trade; factions fight for influence."]
      - k: play
        s: plan
        req: true
        ru: ["Подданство", "Вступите в любую нацию: дом, должность, налоги и защита."]
        en: ["Citizenship", "Join any nation: a home, a post, taxes and protection."]
      - k: play
        s: plan
        req: true
        ru: ["Путь к власти", "Переворот при феодализме, выборы в демократиях, партийная лестница в однопартийных режимах."]
        en: ["The road to power", "A coup under feudalism, elections in democracies, the party ladder in one-party states."]
      - k: play
        s: plan
        req: true
        ru: ["Вселение в любого человека", "Крестьянин, купец, полководец, пророк, вождь или король — играйте за кого угодно."]
