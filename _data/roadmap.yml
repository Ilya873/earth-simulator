    when: { ru: "≈ 2029", en: "≈ 2029" }
    goal:
      ru: "Виды рождаются, приспосабливаются и вымирают сами, а разум может возникнуть у любого из них."
      en: "Species emerge, adapt and die out on their own — and intelligence can arise in any of them."
    why:
      ru: "Видообразованию нужно глубокое время и меняющиеся континенты (5.0). Игра за существо — это то же вселение из 3.3."
      en: "Speciation needs deep time and shifting continents (5.0). Playing as a creature is the same possession mechanism from 3.3."
    hood:
      ru: "Вид — это геном (набор признаков: размер, питание, покров, конечности, терпимость к холоду и жаре, плодовитость) плюс ареал. Отбор идёт по приспособленности к климату и биому, а изоляция популяций ведёт к расхождению видов. Облик существ собирается процедурно из тех же признаков — в том же lowpoly-стиле."
      en: "A species is a genome (traits: size, diet, coat, limbs, cold and heat tolerance, fertility) plus a range. Selection follows fitness to climate and biome; isolated populations diverge into new species. Creatures’ looks are assembled procedurally from the same traits — in the same low-poly style."
    items:
      - k: sim
        s: idea
        req: true
        ru: ["Эволюция", "Отбор и видообразование по биомам: острова и континенты рождают новые ветви жизни."]
        en: ["Evolution", "Selection and speciation by biome: islands and continents give rise to new branches of life."]
      - k: play
        s: idea
        ru: ["Древо жизни", "Интерактивная родословная видов от первых до ныне живущих."]
        en: ["Tree of life", "An interactive family tree of species, from the first to the living."]
      - k: play
        s: idea
        ru: ["Редактор существ", "Создайте свой вид и выпустите его в мир."]
        en: ["Creature editor", "Design your own species and release it into the world."]
      - k: play
        s: idea
        ru: ["Игра за любое существо", "От стадного травоядного до хищника на вершине пищевой цепи."]
        en: ["Play as any creature", "From a herd grazer to the apex predator."]
      - k: sim
        s: idea
        ru: ["Нечеловеческие цивилизации", "Разум может возникнуть у любого вида — и основать свою цивилизацию."]
        en: ["Non-human civilisations", "Any species can become sapient and found a civilisation."]
      - k: sim
        s: idea
        req: true
        ru: ["Болезни эволюционируют", "Вирусы мутируют и переходят между видами."]
        en: ["Diseases evolve", "Viruses mutate and jump between species."]

