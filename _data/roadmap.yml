      en: "Supply needs the goods and routes of 3.4; generals need the people of 3.2. Without them troop movement would be mere decoration."
    hood:
      ru: "Отряд — сущность с позицией, составом, запасами и командиром. Путь ищется по графу дорог и рельефу с учётом сезона. Снабжение — поток грузов по логистической сети из 3.4. Небоевые потери считаются по климату клетки: обморожения, жара, голод."
      en: "A unit is an entity with a position, composition, supplies and a commander. Paths are found over the road graph and terrain, accounting for season. Supply is a flow of cargo over 3.4’s logistics network. Non-combat losses follow the local climate: frostbite, heat, hunger."
    grows:
