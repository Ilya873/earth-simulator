  # ───────────────────────────── 4.0
  - id: v40
    ver: "4.0"
    eon: e1
    color: "#9CC3B8"
    status: plan
    major: true
    t: 2028.05
    pos: { x: 1045, y: 330 }
    deps: [v30, v33]
    name: { ru: "Общий мир", en: "Shared World" }
    when: { ru: "≈ зима 2027/28", en: "≈ winter 2027/28" }
    goal:
      ru: "Один мир на нескольких игроков — по интернету и по локальной сети."
      en: "One world for several players — over the internet and on a local network."
    why:
      ru: "Сеть стоит на фундаменте 3.0: команды, предсказуемая симуляция и запуск без интерфейса. Роли — бог, правитель, житель — появляются в 3.3. Выпускать мультиплеер имеет смысл, когда основные системы перестали меняться каждую неделю."
      en: "Networking stands on 3.0’s foundation: commands, a predictable simulation and headless runs. Roles — god, ruler, citizen — arrive in 3.3. It makes sense to ship multiplayer once the core systems stop changing every week."
    hood:
      ru: "Авторитетный сервер: симуляция идёт на сервере (Node.js на VPS или у хоста в локальной сети), клиенты отправляют команды и получают изменения состояния. Прогулка считается локально, синхронизируются позиции и действия. Предсказуемость симуляции позволяет быстро ловить рассинхронизацию."
      en: "An authoritative server: the simulation runs on the server (Node.js on a VPS, or on the host’s PC for LAN), clients send commands and receive state changes. Walk mode runs locally, with positions and actions synchronised. A predictable simulation makes desyncs quick to catch."
    grows:
      ru:
        - "Экономика, законы и войны работают для нескольких игроков сразу."
      en:
        - "The economy, laws and wars work for several players at once."
    items:
      - k: eng
        s: plan
        ru: ["Сервер и локальная сеть", "Выделенный сервер для больших миров и игра с друзьями по LAN."]
        en: ["Server and LAN", "A dedicated server for big worlds and LAN play with friends."]
      - k: play
        s: plan
        ru: ["Роли", "Несколько богов в одном мире, правители держав, жители и путешественники."]
        en: ["Roles", "Several gods in one world, rulers of states, citizens and travellers."]
      - k: play
        s: plan
        ru: ["Режимы", "Совместная песочница, соперничество богов, дипломатия держав, ролевой сервер."]
        en: ["Modes", "Co-op sandbox, rival gods, diplomacy between states, a role-play server."]
      - k: play
        s: plan
        ru: ["Правила мира", "Кто что может менять, голосование за паузу и скорость времени."]
        en: ["World rules", "Who may change what; votes on pausing and the speed of time."]
      - k: com
        s: plan
        ru: ["Steam и сообщество", "Приглашения через Steam, чат, серверы сообщества."]
        en: ["Steam and community", "Steam invites, chat, community servers."]
      - k: gfx
        s: idea
        ru: ["Графика «Ультра»", "Для мощных ПК: WebGPU, физически корректные материалы, объёмные облака, густая растительность."]
        en: ["‘Ultra’ graphics", "For powerful PCs: WebGPU, physically based materials, volumetric clouds, dense vegetation."]

  # ───────────────────────────── 5.0
  - id: v50
    ver: "5.0"
    eon: e2
    color: "#7FB69A"
    status: plan
    major: true
    t: 2028.2
    pos: { x: 1070, y: 525 }
    deps: [v30, v34]
    name: { ru: "Глубокое время", en: "Deep Time" }
    when: { ru: "≈ весна 2028", en: "≈ spring 2028" }
    goal:
      ru: "Планета, живущая миллионы лет: плиты движутся, горы растут и разрушаются, а в недрах лежат настоящие руды."
      en: "A planet that lives for millions of years: plates drift, mountains rise and erode, and real ores lie deep below."
    why:
      ru: "Тектонике нужен глобус из 3.0 — плиты движутся по сфере. Шахты продолжают рудники и экономику из 3.4. А эволюции (5.5) нужна меняющаяся география: виды расходятся, когда континенты разделяются."
      en: "Tectonics needs the globe from 3.0 — plates move on a sphere. Mines extend the mining and economy of 3.4. And evolution (5.5) needs changing geography: species diverge when continents split."
    hood:
      ru: "Многомасштабное время: при ускорении до тысячелетий климат и общество сворачиваются в усреднённые модели. Плиты — поля скоростей на сфере: столкновения поднимают горы, рифты рождают океаны. Гидравлическая эрозия по потоку рек и перенос осадков. Недра — слоистая модель, месторождения возникают из геологических процессов и истощаются."
      en: "Multi-scale time: when sped up to millennia, climate and society collapse into averaged models. Plates are velocity fields on a sphere: collisions raise mountains, rifts open oceans. Hydraulic erosion follows river flow and moves sediment. The interior is a layered model; deposits arise from geology and can be exhausted."
    grows:
      ru:
        - "Ресурсы: из случайных пятен — в геологию; шахтёр и геолог — новые профессии."
        - "Вулканы и землетрясения случаются на границах плит, а их сила — по настоящим шкалам."
      en:
        - "Resources: from random patches to geology; miner and geologist become professions."
        - "Volcanoes and earthquakes happen at plate boundaries, with real-scale strength."
    items:
      - k: sim
        s: idea
        ru: ["Шкала времени", "Годы ↔ тысячелетия ↔ миллионы лет; быстрый геологический режим."]
        en: ["A time dial", "Years ↔ millennia ↔ millions of years; a fast geological mode."]
      - k: sim
        s: idea
        ru: ["Тектоника плит", "Дрейф континентов, рифты, горообразование; вулканы и землетрясения — на границах плит."]
        en: ["Plate tectonics", "Continental drift, rifts, mountain building; volcanoes and quakes at plate boundaries."]
      - k: sim
        s: idea
        ru: ["Эрозия и реки", "Реки прорезают долины и намывают дельты, появляются настоящие озёра."]
        en: ["Erosion and rivers", "Rivers carve valleys and build deltas; real lakes appear."]
      - k: sim
        s: idea
        ru: ["Недра планеты", "Кора, мантия и ядро; месторождения рождаются геологией и истощаются."]
        en: ["The planet’s interior", "Crust, mantle and core; ore deposits form by geology and run out."]
      - k: walk
        s: idea
        ru: ["Шахты", "Спуститесь в рудник: штреки, проходка, добыча руды."]
        en: ["Mines", "Descend into a mine: tunnels, digging, ore extraction."]

  # ───────────────────────────── 5.5
  - id: v55
    ver: "5.5"
    eon: e2
    color: "#64B3AA"
    status: plan
    t: 2028.45
    pos: { x: 1240, y: 440 }
    deps: [v50, v33]
    name: { ru: "Происхождение видов", en: "Origin of Species" }
    when: { ru: "≈ лето 2028", en: "≈ summer 2028" }
    goal:
      ru: "Виды рождаются, приспосабливаются и вымирают сами, а разум может возникнуть у любого из них."
      en: "Species emerge, adapt and die out on their own — and intelligence can arise in any of them."
    why:
      ru: "Видообразованию нужно глубокое время и меняющиеся континенты (5.0). Игра за существо — это то же вселение из 3.3."
      en: "Speciation needs deep time and shifting continents (5.0). Playing as a creature is the same possession mechanism from 3.3."
    hood:
      ru: "Вид — это геном (набор признаков: размер, питание, покров, конечности, терпимость к холоду и жаре, плодовитость) плюс ареал. Отбор идёт по приспособленности к климату и биому, а изоляция популяций ведёт к расхождению видов. Облик существ собирается процедурно из тех же признаков — в том же lowpoly-стиле."
      en: "A species is a genome (traits: size, diet, coat, limbs, cold and heat tolerance, fertility) plus a range. Selection follows fitness to climate and biome; isolated populations diverge into new species. Creatures’ looks are assembled procedurally from the same traits — in the same low-poly style."
    grows:
      ru:
        - "Охота, приручение и скотоводство работают с живыми популяциями видов."
        - "Эпидемии: болезни эволюционируют вместе с носителями."
      en:
        - "Hunting, taming and herding work with living species populations."
        - "Epidemics: diseases evolve together with their hosts."
    items:
      - k: sim
        s: idea
        req: true
        ru: ["Эволюция", "Отбор и видообразование по биомам: острова и континенты рождают новые ветви жизни."]
        en: ["Evolution", "Selection and speciation by biome: islands and continents give rise to new branches of life."]
      - k: play
        s: idea
        ru: ["Древо жизни", "Интерактивная родословная видов от первых до ныне живущих."]
        en: ["Tree of life", "An interactive family tree of species, from the first to the living."]
      - k: play
        s: idea
        ru: ["Редактор существ", "Создайте свой вид и выпустите его в мир."]
        en: ["Creature editor", "Design your own species and release it into the world."]
      - k: play
        s: idea
        ru: ["Игра за любое существо", "От стадного травоядного до хищника на вершине пищевой цепи."]
        en: ["Play as any creature", "From a herd grazer to the apex predator."]
      - k: sim
        s: idea
        ru: ["Нечеловеческие цивилизации", "Разум может возникнуть у любого вида — и основать свою цивилизацию."]
        en: ["Non-human civilisations", "Any species can become sapient and found a civilisation."]
      - k: sim
        s: idea
        req: true
        ru: ["Болезни эволюционируют", "Вирусы мутируют и переходят между видами."]
        en: ["Diseases evolve", "Viruses mutate and jump between species."]

