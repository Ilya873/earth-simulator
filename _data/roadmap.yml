# Дорожная карта Earth Simulator — звёздная карта на главной.
# Каждое обновление (phase) — звёздная система, каждый пункт (item) — планета на её орбите.
#
# Как обновлять:
#   * статус пункта: s: done | wip | plan | idea   (в игре / в работе / запланировано / задумка)
#     готовые планеты на карте светятся, в работе — наполовину
#   * статус обновления: status (те же значения); now: true — метка «Вы здесь» (ровно у одного)
#   * пункт, о котором просили игроки: req: true (подсвечивается фильтром «Идеи игроков»)
#   * k — направление: sim, walk, play, eng, gfx, com (названия ниже, в tracks)
#   * t — дата в долях года (2027.5 = середина 2027) — по ней строится шкала времени внизу карты
#   * pos — место системы на карте: x 0…1400 (слева направо — время), y 0…640 (выше — ближе к звёздам)
#   * img — скриншот в карточке обновления (необязательно)
# Каждый пункт: ru: [заголовок, пояснение], en: [title, description]

status:
  done: { ru: "в игре", en: "in the game" }
  wip: { ru: "в работе", en: "in progress" }
  plan: { ru: "запланировано", en: "planned" }
  idea: { ru: "задумка", en: "concept" }

tracks:
  sim: { ru: "Симуляция", en: "Simulation" }
  walk: { ru: "Прогулка", en: "Walk mode" }
  play: { ru: "Игрок", en: "Player" }
  eng: { ru: "Движок", en: "Engine" }
  gfx: { ru: "Графика", en: "Graphics" }
  com: { ru: "Сообщество", en: "Community" }

eons:
  - id: e1
    roman: "I"
    color: "#D9A75B"
    name: { ru: "Мир людей", en: "The Human World" }
    span: { ru: "2026 — 2028", en: "2026 — 2028" }
    label: { x: 560, y: 92 }
  - id: e2
    roman: "II"
    color: "#6FB39E"
    name: { ru: "Мир живого", en: "The Living World" }
    span: { ru: "2028 — 2029", en: "2028 — 2029" }
    label: { x: 880, y: 560 }
  - id: e3
    roman: "III"
    color: "#8E9BD8"
    name: { ru: "Мир звёзд", en: "The World of Stars" }
    span: { ru: "2029 →", en: "2029 →" }
    label: { x: 1120, y: 58 }

phases:

  # ───────────────────────────── 2.0
  - id: v20
    ver: "2.0"
    eon: e1
    color: "#E8D3A2"
    status: done
    t: 2026.76
    pos: { x: 95, y: 330 }
    deps: []
    img: /assets/img/shots/walk-volaria-1600.jpg
    name: { ru: "Новый мир", en: "A New World" }
    when: { ru: "октябрь 2026", en: "October 2026" }
    goal:
      ru: "Глобальное обновление, с которого всё началось: новая графика, прогулка от первого лица по любой точке планеты, династии, летопись и подробная статистика."
      en: "The global update where it all began: new graphics, first-person walks anywhere on the planet, dynasties, a chronicle and detailed statistics."
    why:
      ru: "Точка отсчёта. Всё остальное строится на том, что уже работает в игре."
      en: "The starting point. Everything else is built on what already works in the game."
    hood:
      ru: "Климат: испарение и перенос влаги ветром, муссоны и дождевая тень, океанские течения по модели Стоммела, льды и парниковый эффект. Природа: 19 биомов по схеме Уиттекера, 35 видов животных с моделью «хищник — жертва». Общество: численность по клеткам, знать — поимённо, до 24 000 персонажей с родословными."
      en: "Climate: evaporation and wind-borne moisture, monsoons and rain shadows, Stommel-model ocean currents, ice and greenhouse forcing. Nature: 19 Whittaker biomes and 35 species with predator–prey dynamics. Society: population per cell, nobility tracked by name — up to 24,000 characters with family trees."
    items:
      - k: sim
        s: done
        ru: ["Живой климат", "Испарение, ветра, муссоны, дождевая тень, океанские течения, ледники и CO₂."]
        en: ["Living climate", "Evaporation, winds, monsoons, rain shadows, ocean currents, ice sheets and CO₂."]
      - k: sim
        s: done
        ru: ["Природа", "19 биомов и 35 видов животных: вымирание, миграции и одомашнивание."]
        en: ["Nature", "19 biomes and 35 animal species: extinction, migration and domestication."]
      - k: sim
        s: done
        ru: ["Цивилизации", "Шесть эпох, десять форм правления, войны, флоты, колонии и ядерное оружие."]
        en: ["Civilisations", "Six eras, ten forms of government, wars, fleets, colonies and nuclear weapons."]
      - k: sim
        s: done
        ru: ["Династии", "Родословные, характеры и навыки правителей, выборы, перевороты, войны за наследство."]
        en: ["Dynasties", "Family trees, rulers’ traits and skills, elections, coups and wars of succession."]
      - k: walk
        s: done
        ru: ["Прогулка от первого лица", "В любой клетке мира: погода, день и ночь, жители, транспорт и оружие своей эпохи."]
        en: ["First-person walks", "In any cell of the world: weather, day and night, locals, vehicles and weapons of the era."]
      - k: gfx
        s: done
        ru: ["Новая графика и музыка", "Рельеф, динамическая вода, смена дня и ночи; музыка подстраивается под эпоху."]
        en: ["New graphics and music", "Terrain, dynamic water, day and night; music adapts to the era."]
      - k: com
        s: done
        ru: ["Мастерская Steam", "Редактор модов прямо в игре: карты из картинок, сценарии, животные, модели и баланс."]
        en: ["Steam Workshop", "An in-game mod editor: maps from images, scenarios, animals, models and balance."]

  # ───────────────────────────── 2.1
  - id: v21
    ver: "2.1"
    eon: e1
    color: "#E8B65E"
    status: wip
    now: true
    t: 2026.88
    pos: { x: 205, y: 250 }
    deps: [v20]
    img: /assets/devlog/2026-10-11-update-2-1-0/port-modern-1600.jpg
    name: { ru: "Пути сообщения", en: "Connections" }
    when: { ru: "≈ ноябрь 2026", en: "≈ November 2026" }
    goal:
      ru: "Мир обзаводится портами, железными дорогами, аэропортами и военными базами, а прогулка — работой, деньгами, законом и поручениями жителей."
      en: "The world gains ports, railways, airports and military bases, and walk mode gains jobs, money, law and quests from the locals."
    why:
      ru: "Большая часть уже собрана и работает в тестовой сборке. Осталось доделать, отполировать и выпустить, попутно исправив несостыковки эпох."
      en: "Most of it is already built and running in the test build. What’s left is to finish, polish and ship it — and fix era inconsistencies along the way."
    hood:
      ru: "Новые системы прогулки подключаются к ядру через реестры и не трогают старый код. Лошади и повозки будут зависеть не от номера эпохи, а от того, приручила ли держава коня и знает ли колесо; там, где коней нет, — ламы и верблюды."
      en: "The new walk-mode systems hook into the core through registries without touching old code. Horses and carts will depend not on the era number but on whether a state has tamed the horse and knows the wheel; where there are no horses — llamas and camels."
    items:
      - k: walk
        s: wip
        ru: ["Морские порты", "Торговые суда прибывают и уходят; можно работать грузчиком и болтать с капитанами и матросами."]
        en: ["Seaports", "Merchant ships arrive and depart; work as a docker and chat with captains and sailors."]
      - k: sim
        s: wip
        ru: ["Морские сражения", "Флоты, блокады и десанты — бой можно смотреть с палубы от первого лица."]
        en: ["Naval battles", "Fleets, blockades and landings — watch the battle from the deck in first person."]
      - k: walk
        s: wip
        ru: ["Железные дороги", "От паровоза до магнитного поезда: ехать пассажиром или работать машинистом."]
        en: ["Railways", "From steam engines to maglev: ride as a passenger or work as a driver."]
      - k: walk
        s: wip
        ru: ["Аэропорты", "Самолёты и вертолёты; угнанный самолёт перехватят истребители — придётся прыгать с парашютом."]
        en: ["Airports", "Planes and helicopters; steal one and fighters will intercept you — time for the parachute."]
      - k: walk
        s: wip
        ru: ["Военные базы", "От частокола до базы будущего: угнать танк или наняться в караул."]
        en: ["Military bases", "From a stockade to a base of the future: steal a tank or sign up for guard duty."]
      - k: walk
        s: wip
        ru: ["Деньги и работа", "Валюты держав — от мер зерна до кредитов, лавки, подработки и репутация."]
        en: ["Money and work", "State currencies — from measures of grain to credits — shops, odd jobs and reputation."]
      - k: walk
        s: wip
        ru: ["Закон и порядок", "Розыск, стража, полиция, штрафы, награды за голову и помилование."]
        en: ["Law and order", "Wanted levels, guards, police, fines, bounties and pardons."]
      - k: walk
        s: wip
        ru: ["Поручения жителей", "12 видов заданий из событий мира: голод, мор, разбойники, война, урожай."]
        en: ["Quests from locals", "12 quest types born from world events: famine, plague, bandits, war, harvest."]
      - k: sim
        s: plan
        ru: ["Лошади — только после приручения", "Кони, колесницы и повозки появляются, когда держава их действительно приручила и знает колесо."]
        en: ["Horses only after taming", "Horses, chariots and carts appear once a state has actually tamed them and knows the wheel."]

  # ───────────────────────────── 2.2
  - id: v22
    ver: "2.2"
    eon: e1
    color: "#EDD08A"
    status: plan
    t: 2027.02
    pos: { x: 305, y: 365 }
    deps: [v21]
    name: { ru: "Стихии и картография", en: "Elements and Cartography" }
    when: { ru: "≈ зима 2026/27", en: "≈ winter 2026/27" }
    goal:
      ru: "Бедствия получают настоящие масштабы и следы, моря — лёд, а карта — новые краски и ваши названия."
      en: "Disasters get real scales and lasting marks, seas get ice, and the map gets new colours and your own names."
    why:
      ru: "Всё это не требует перестройки движка и быстро делается, а играть становится заметно интереснее. Пока зреет большая перестройка, игра продолжает расти."
      en: "None of this needs an engine rebuild and it’s quick to do, while the game gets noticeably richer. The game keeps growing while the big rebuild is prepared."
    hood:
      ru: "Внутренняя «сила» бедствия пересчитывается в настоящие шкалы и обратно. Поиск морского пути начинает учитывать лёд, а лёд — сезоны. Кратер — понижение рельефа, которое со временем выравнивается, заполняется водой и зарастает."
      en: "A disaster’s internal ‘power’ is mapped to real scales and back. Sea pathfinding starts respecting ice, and ice follows the seasons. A crater is a dent in the terrain that levels out over time, fills with water and greens over."
    items:
      - k: play
        s: plan
        req: true
        ru: ["Карточки бедствий", "Наведите на ураган или пожар — сила, площадь, осадки, ущерб и сколько ещё продлится."]
        en: ["Disaster cards", "Hover a hurricane or a wildfire to see strength, area, rainfall, damage and time remaining."]
      - k: sim
        s: plan
        req: true
        ru: ["Настоящие шкалы", "Ураганы по Саффиру — Симпсону, вулканы по VEI, землетрясения по магнитуде, удары — в килотоннах."]
        en: ["Real-world scales", "Hurricanes on Saffir–Simpson, volcanoes on VEI, earthquakes by magnitude, impacts in kilotons."]
      - k: sim
        s: plan
        req: true
        ru: ["Замерзающие моря", "Лёд закрывает путь кораблям: сезонные окна навигации и замёрзшие проливы."]
        en: ["Freezing seas", "Ice blocks ships: seasonal navigation windows and frozen straits."]
      - k: sim
        s: plan
        req: true
        ru: ["Кратеры", "Метеориты и ядерные удары оставляют кратеры, которые заполняются водой и со временем зарастают."]
        en: ["Craters", "Meteors and nukes leave craters that fill with water and slowly heal over time."]
      - k: play
        s: plan
        req: true
        ru: ["Отклонение температуры", "Вместо средней температуры суши — насколько теплее или холоднее начала мира."]
        en: ["Temperature anomaly", "Instead of average land temperature — how much warmer or colder than at the start."]
      - k: gfx
        s: plan
        req: true
        ru: ["Новые краски карты", "Эпохи и показатели различимы с первого взгляда, режим для дальтоников, тонкие стрелки ветра."]
        en: ["New map colours", "Eras and indicators distinct at a glance, a colour-blind mode, slimmer wind barbs."]
      - k: play
        s: plan
        req: true
        ru: ["Свои названия", "Переименуйте державы, города, правителей и формы правления; свои цвета и флаги."]
        en: ["Your own names", "Rename states, cities, rulers and forms of government; your own colours and flags."]

  # ───────────────────────────── 3.0
  - id: v30
    ver: "3.0"
    eon: e1
    color: "#D9B98A"
    status: plan
    major: true
    t: 2027.2
    pos: { x: 415, y: 280 }
    deps: [v22]
    name: { ru: "Фундамент", en: "Foundation" }
    when: { ru: "≈ весна 2027", en: "≈ spring 2027" }
    goal:
      ru: "Перестроить движок под большие планы: мир становится шаром, симуляция — быстрой и предсказуемой, а код — готовым к сети и другим планетам."
      en: "Rebuild the engine for the big plans: the world becomes a globe, the simulation fast and predictable, the code ready for networking and other planets."
    why:
      ru: "Самое важное обновление: от него тянутся связи почти ко всем остальным. Мультиплеер, другие планеты и живые жители невозможно надстроить поверх однопоточного мира, существующего в единственном экземпляре. Чем позже это сделать, тем больше кода придётся переписывать."
      en: "The most important update: links run from it to almost all the others. Multiplayer, other planets and living inhabitants can’t be built on top of a single-threaded, one-of-a-kind world. The later it’s done, the more code must be rewritten."
    hood:
      ru: "Симуляция переезжает в отдельный поток (Web Worker): состояние мира — типизированные массивы в общей памяти, рендер читает их без копирования. Каждое действие игрока — команда с номером тика; единый генератор случайности с зерном и фиксированный шаг дают воспроизводимую историю. Мир становится объектом — их может быть несколько. Технологии, здания, техника и товары описываются таблицами данных, которые читают и моды. Сохранения получают цепочку миграций. three.js обновляется с прицелом на WebGPU. Симуляцию можно запускать без интерфейса в Node.js — для автотестов, а позже для сервера."
      en: "The simulation moves to its own thread (Web Worker): world state lives in typed arrays in shared memory, read by the renderer without copying. Every player action becomes a command stamped with a tick; one seeded random generator and a fixed step make history reproducible. The world becomes an object — there can be several. Technologies, buildings, vehicles and goods are described in data tables that mods can read too. Saves get a chain of migrations. three.js is updated with WebGPU in mind. The simulation can run headless in Node.js — for automated tests now, and for the server later."
    items:
      - k: sim
        s: plan
        ru: ["Мир-глобус", "Карта замыкается по долготе, площади клеток учитывают широту, в 3D — настоящая планета из космоса."]
        en: ["A globe", "The map wraps east–west, cell areas follow latitude, and 3D shows a real planet from orbit."]
      - k: sim
        s: plan
        ru: ["Земля по реальным высотам", "Карта «Земля» строится по настоящим данным рельефа суши и дна океана."]
        en: ["Earth from real elevation", "The Earth map is built from real land and ocean-floor elevation data."]
      - k: eng
        s: plan
        ru: ["Симуляция в отдельном потоке", "Интерфейс и прогулка не тормозят; ускорение ×100 и выше."]
        en: ["Simulation on its own thread", "The UI and walk mode stay smooth; speeds of ×100 and beyond."]
      - k: eng
        s: plan
        ru: ["Большие миры", "Карты примерно до 500×250 клеток и смена размера без перезапуска игры."]
        en: ["Bigger worlds", "Maps up to roughly 500×250 cells, resized without restarting the game."]
      - k: eng
        s: plan
        ru: ["Предсказуемая история", "Одно зерно — одна история: повторы, воспроизводимые ошибки и основа мультиплеера."]
        en: ["Reproducible history", "One seed, one history: replays, reproducible bugs and the basis for multiplayer."]
      - k: eng
        s: plan
        ru: ["Данные вместо кода", "Технологии, здания, техника и товары — в таблицах; моды получают доступ ко всему."]
        en: ["Data, not code", "Technologies, buildings, vehicles and goods live in tables that mods can reach."]
      - k: eng
        s: plan
        ru: ["Новые сохранения", "Старые миры переносятся автоматически, сколько бы версий ни прошло."]
        en: ["New saves", "Old worlds migrate automatically, however many versions later."]
      - k: gfx
        s: plan
        ru: ["Новый рендер", "Свежий three.js: атмосфера с рассеянием света, вода с пеной, мягкие тени, цветокоррекция."]
        en: ["New renderer", "A fresh three.js: atmospheric scattering, foamy water, soft shadows, colour grading."]
      - k: com
        s: plan
        ru: ["Переводы сообществом", "Таблицы строк вместо встроенного текста — дорога к немецкому, испанскому, китайскому и другим."]
        en: ["Community translations", "String tables instead of inline text — the road to German, Spanish, Chinese and more."]

  # ───────────────────────────── 3.1
  - id: v31
    ver: "3.1"
    eon: e1
    color: "#C9C27A"
    status: plan
    t: 2027.42
    pos: { x: 520, y: 188 }
    deps: [v30]
    name: { ru: "Древо знаний", en: "Tree of Knowledge" }
    when: { ru: "≈ лето 2027", en: "≈ summer 2027" }
    goal:
      ru: "Вместо одного числа «технологии» — настоящее древо открытий. Всё в мире, от повозок до архитектуры, следует тому, что этот народ уже знает."
      en: "Instead of a single ‘technology’ number — a real tree of discoveries. Everything in the world, from carts to architecture, follows what this people actually knows."
    why:
      ru: "Одежда жителей, товары в лавках, техника армий, профессии и здания — всё ссылается на знания державы. Без древа каждая новая система снова привязывалась бы к номеру эпохи, как вышло с лошадьми."
      en: "Clothing, shop goods, army equipment, professions and buildings all refer to what a state knows. Without the tree, every new system would again key off the era number — as happened with horses."
    hood:
      ru: "Открытия образуют граф зависимостей; вес каждого направления зависит от условий державы — рельефа, ресурсов, войн, торговли, культуры. Эпоха становится следствием открытий, а не порогом числа. Прогулка, 3D-карта, лавки и армии спрашивают «знает ли держава X», а не «какая сейчас эпоха»."
      en: "Discoveries form a dependency graph; each direction is weighted by the state’s conditions — terrain, resources, wars, trade, culture. An era becomes a consequence of discoveries rather than a numeric threshold. Walk mode, the 3D map, shops and armies ask ‘does this state know X’, not ‘what era is it’."
    items:
      - k: sim
        s: plan
        ru: ["Древо из ~150 открытий", "Шесть ветвей: хозяйство, ремесло, мореходство, военное дело, наука и общество."]
        en: ["A tree of ~150 discoveries", "Six branches: economy, crafts, seafaring, warfare, science and society."]
      - k: sim
        s: plan
        ru: ["Больше эпох", "Между античностью и индустриальной эпохой появятся средневековье и Новое время."]
        en: ["More eras", "The Middle Ages and the early modern era fill the gap between antiquity and industry."]
      - k: sim
        s: plan
        ru: ["Свой путь у каждого народа", "Степняки раньше приручат коня, островитяне раньше освоят мореходство."]
        en: ["Every people finds its own path", "Steppe folk tame the horse first, islanders master the sea first."]
      - k: play
        s: plan
        req: true
        ru: ["Окно исследований", "У любой державы видно, что изучено, что изучается сейчас и что в планах."]
        en: ["Research window", "For any state: what has been learned, what is being studied and what comes next."]
      - k: sim
        s: plan
