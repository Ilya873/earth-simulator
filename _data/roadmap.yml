      en: "Levels of detail for society: far from the player, people are cell statistics; closer — neighbourhoods of families and trades; nearby — full individuals. A person you meet ‘materialises’ from the seed and lives on permanently after you leave. Behaviour is needs-based AI with schedules. Interiors are assembled from room templates by era and culture."
    items:
      - k: walk
