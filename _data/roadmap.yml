        ru: ["Партизанская война", "Сопротивление, повстанцы со своими армиями, борьба за население."]
        en: ["Guerrilla war", "Resistance, rebels with armies of their own, the struggle for hearts and minds."]
      - k: sim
        s: plan
        ru: ["Полководцы", "Навыки командиров, состав армии и рельеф решают исход сражения."]
